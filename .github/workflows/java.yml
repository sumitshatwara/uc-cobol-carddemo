name: java-target

# Three test layers of the Java 21 conversion: unit (JUnit), regression (Java vs legacy golden
# files through tools/parity/compare.py) and functional (Playwright on the operations console).
# Slices never edit this file: new chain modules are discovered from java/*/parity-chains.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Generated VSAM tables/entities are current
        run: make java-gen-check

      - name: Unit tests (JUnit)
        run: make test-unit

      - name: Estate up and legacy chains compiled
        run: make up build

      - name: Legacy parity is green (the oracle)
        run: make parity

      - name: Fixture loader loads every case
        run: make java-fixtures-check

      - name: Regression - Java vs legacy golden files, field by field
        run: |
          if cat java/*/parity-chains 2>/dev/null | grep -qv '^#'; then make parity-java; else echo "no Java chain modules yet"; fi

      - name: Functional - Playwright journeys on the console
        run: |
          make ui-install
          (cd ui && npx playwright install --with-deps chromium)
          make test-e2e

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-target-reports
          path: |
            work/parity/*.md
            java/*/target/surefire-reports/*.xml
            ui/test-results/
            ui/playwright-report/
          if-no-files-found: ignore
