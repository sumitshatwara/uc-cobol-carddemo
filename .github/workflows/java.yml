name: Java foundation

on:
  push:
    paths:
      - "java/**"
      - "ui/**"
      - "Makefile"
      - "docker-compose.java.yml"
      - ".github/workflows/java.yml"
  pull_request:
    paths:
      - "java/**"
      - "ui/**"
      - "Makefile"
      - "docker-compose.java.yml"
      - ".github/workflows/java.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java/**/pom.xml
      - run: make test-unit

  regression:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java/**/pom.xml
      - uses: docker/setup-buildx-action@v3
      - run: make up
      - run: make build
      - run: make java-db
      - run: make test-unit
        env:
          CARDDEMO_DB_TESTS: "true"
      - run: make parity-java
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-parity-report
          path: work/parity/report-java.md
          if-no-files-found: ignore

  functional:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java/**/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make ui-install ui-build
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: make java-db java-build
      - run: make test-functional
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ui/playwright-report
          if-no-files-found: ignore
