<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CardDemo Business Rule Explorer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--mut:#8b949e;--acc:#58a6ff;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:24px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0}h1 small{color:var(--mut);font-weight:400}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.stat b{font-size:16px;margin-right:4px}
.bar{display:flex;gap:8px;padding:10px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
button.chip{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:3px 11px;cursor:pointer;font-size:13px}
button.chip.on{background:#1f6feb;border-color:#1f6feb}
input[type=search]{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;width:280px}
select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px}
main{display:grid;grid-template-columns:minmax(420px,44%) 1fr;height:calc(100vh - 112px)}
#list{overflow:auto;border-right:1px solid var(--line)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--panel);color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase}
tr.r{cursor:pointer}tr.r:hover{background:#1c2129}tr.r.sel{background:#1f2a3a}
.id{font-family:ui-monospace,Menlo,monospace;white-space:nowrap;color:var(--acc)}
.tag{display:inline-block;border-radius:4px;padding:0 6px;font-size:11px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.tag.fx{color:var(--ok);border-color:#238636}.tag.find{color:var(--warn);border-color:#9e6a03}.tag.tr{color:var(--acc);border-color:#1f6feb}
#detail{overflow:auto;padding:18px 24px}#detail h2{margin:0 0 4px;font-size:18px}
.sec{margin:16px 0}.sec h3{font-size:12px;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
.gwt{display:grid;grid-template-columns:70px 1fr;gap:4px 10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px}
.gwt b{color:var(--mut)}.finding{border-left:3px solid var(--warn);background:#2a2110;padding:8px 12px;border-radius:4px}
code,.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}a{color:var(--acc)}
.fld{display:inline-block;margin:2px 6px 2px 0;padding:2px 7px;background:var(--panel);border:1px solid var(--line);border-radius:4px;cursor:help}
.empty{color:var(--mut);padding:30px}
</style></head><body>
<header><h1>CardDemo Business Rule Explorer <small>COBOL / JCL / Db2 / PL/I / HLASM -> Java 21</small></h1><div class="stats" id="stats"></div></header>
<div class="bar"><span id="slices"></span><select id="cat" data-testid="category-filter"><option value="">all categories</option></select>
<button class="chip" id="onlyFind" data-testid="findings-toggle">findings only</button>
<input type="search" id="q" placeholder="search id, text, field, file..." data-testid="rule-search"><span id="count" style="color:var(--mut)"></span></div>
<main><div id="list"><table><thead><tr><th>Rule</th><th>Title</th><th>Category</th><th>Proof</th></tr></thead><tbody id="rows"></tbody></table></div>
<div id="detail"><div class="empty">Select a rule.</div></div></main>
<script>
const D={"rules": [{"id": "BR-POST-001", "title": "CBTRN02C SYSOUT sequence and counters", "rule": "CBTRN02C writes exactly these SYSOUT lines in order: 'START OF EXECUTION OF PROGRAM CBTRN02C', any per-record TCATBAL 'Creating' lines, then after all files are closed 'TRANSACTIONS PROCESSED :' and 'TRANSACTIONS REJECTED  :' (two spaces before the colon) each followed by the unsigned 9-digit zero-padded counter (PIC 9(09)), then 'END OF EXECUTION OF PROGRAM CBTRN02C'. The processed count includes rejected records.", "category": "sysout", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 184, "endLine": 186}, {"file": "app/cbl/CBTRN02C.cbl", "startLine": 194, "endLine": 194}, {"file": "app/cbl/CBTRN02C.cbl", "startLine": 227, "endLine": 228}, {"file": "app/cbl/CBTRN02C.cbl", "startLine": 232, "endLine": 232}], "fields": ["WS-TRANSACTION-COUNT", "WS-REJECT-COUNT"], "given": "DALYTRAN with 2 records, one of which is overlimit (p04 input)", "when": "POSTTRAN STEP15 runs", "then": "SYSOUT is START OF EXECUTION OF PROGRAM CBTRN02C / TRANSACTIONS PROCESSED :000000002 / TRANSACTIONS REJECTED  :000000001 / END OF EXECUTION OF PROGRAM CBTRN02C", "fixtures": ["fixtures/posting/p04-overlimit-reject", "fixtures/posting/p01-baseline-mixed"], "finding": null, "slice": "posting"}, {"id": "BR-POST-002", "title": "Sequential read loop over DALYTRAN", "rule": "DALYTRAN is read sequentially; status '00' processes the record and adds 1 to WS-TRANSACTION-COUNT before validation, status '10' sets END-OF-FILE='Y' and ends the loop, any other status is an I/O error (see BR-POST-025). Each record's validation trailer is reset to reason 0 / spaces before validation.", "category": "control-flow", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 202, "endLine": 219}, {"file": "app/cbl/CBTRN02C.cbl", "startLine": 345, "endLine": 369}], "fields": ["DALYTRAN-RECORD", "DALYTRAN-STATUS", "END-OF-FILE", "WS-VALIDATION-FAIL-REASON", "WS-VALIDATION-FAIL-REASON-DESC"], "given": "DALYTRAN with 4 valid records", "when": "CBTRN02C reads to end of file", "then": "4 records are validated and posted in input order; TRANSACTIONS PROCESSED :000000004", "fixtures": ["fixtures/posting/p01-baseline-mixed"], "finding": null, "slice": "posting"}, {"id": "BR-POST-003", "title": "Validation order: card cross-reference first, then account", "rule": "1500-VALIDATE-TRAN looks up the card in XREFFILE first; the account lookup and the limit/expiry checks run only if the card lookup left reason 0. No other validation exists (the source carries the comment 'ADD MORE VALIDATIONS HERE').", "category": "validation", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 370, "endLine": 378}], "fields": ["DALYTRAN-CARD-NUM", "XREF-ACCT-ID", "WS-VALIDATION-FAIL-REASON"], "given": "a transaction whose card 4000999999999999 has no CARDXREF record", "when": "it is validated", "then": "it is rejected with reason 0100 and ACCTFILE is never read for it", "fixtures": ["fixtures/posting/p02-invalid-card"], "finding": null, "slice": "posting"}, {"id": "BR-POST-004", "title": "Reject reason 100: card number not in CARDXREF", "rule": "A random READ of XREFFILE by DALYTRAN-CARD-NUM that raises INVALID KEY sets reason 100 and description 'INVALID CARD NUMBER FOUND'. On success CARD-XREF-RECORD (including XREF-ACCT-ID) is loaded for the later steps.", "category": "validation", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 380, "endLine": 392}], "fields": ["DALYTRAN-CARD-NUM", "FD-XREF-CARD-NUM", "CARD-XREF-RECORD", "XREF-ACCT-ID"], "given": "DALYTRAN record 0000000000000002 with card 4000999999999999 and no matching CARDXREF row", "when": "CBTRN02C validates it", "then": "one DALYREJS record with trailer '0100INVALID CARD NUMBER FOUND'; STEP15 RC 4", "fixtures": ["fixtures/posting/p02-invalid-card"], "finding": null, "slice": "posting"}, {"id": "BR-POST-005", "title": "Reject reason 101: account record not found", "rule": "With a valid cross-reference, ACCTFILE is read by XREF-ACCT-ID; INVALID KEY sets reason 101 'ACCOUNT RECORD NOT FOUND' and neither the limit nor the expiry check runs.", "category": "validation", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 393, "endLine": 399}], "fields": ["XREF-ACCT-ID", "FD-ACCT-ID", "ACCOUNT-RECORD"], "given": "card 4000000000001099 maps to account 00000001099 which is absent from ACCTDATA", "when": "the transaction is validated", "then": "DALYREJS trailer '0101ACCOUNT RECORD NOT FOUND'; TRANSACTIONS REJECTED  :000000001; RC 4", "fixtures": ["fixtures/posting/p03-account-missing"], "finding": null, "slice": "posting"}, {"id": "BR-POST-006", "title": "Credit-limit check uses cycle amounts, not the current balance", "rule": "WS-TEMP-BAL = ACCT-CURR-CYC-CREDIT - ACCT-CURR-CYC-DEBIT + DALYTRAN-AMT. The transaction passes when ACCT-CREDIT-LIMIT >= WS-TEMP-BAL (equality accepted); otherwise reason 102 'OVERLIMIT TRANSACTION'. ACCT-CURR-BAL plays no part. Because accepted transactions update the cycle fields immediately (BR-POST-020), later records in the same run see the new cycle totals.", "category": "calculation", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 403, "endLine": 413}], "fields": ["ACCT-CURR-CYC-CREDIT", "ACCT-CURR-CYC-DEBIT", "DALYTRAN-AMT", "ACCT-CREDIT-LIMIT", "WS-TEMP-BAL"], "given": "account 1003 with ACCT-CREDIT-LIMIT 1000.00, ACCT-CURR-CYC-CREDIT 950.00, ACCT-CURR-CYC-DEBIT 0.00; purchases of 50.00 then 100.00", "when": "both are posted in one run", "then": "50.00 is accepted (950-0+50 = 1000 <= 1000, cycle credit becomes 1000.00); 100.00 is rejected with '0102OVERLIMIT TRANSACTION' (1000+100 = 1100 > 1000)", "fixtures": ["fixtures/posting/p04-overlimit-reject"], "finding": null, "slice": "posting"}, {"id": "BR-POST-007", "title": "Payments and credits make the limit check stricter", "rule": "Negative amounts are added to ACCT-CURR-CYC-DEBIT (BR-POST-020), so the field holds a negative number; the formula then subtracts it, which adds the absolute value of every payment/credit to WS-TEMP-BAL. A payment therefore increases, rather than reduces, the exposure used by later limit checks.", "category": "calculation", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 403, "endLine": 407}, {"file": "app/cbl/CBTRN02C.cbl", "startLine": 548, "endLine": 552}], "fields": ["ACCT-CURR-CYC-CREDIT", "ACCT-CURR-CYC-DEBIT", "WS-TEMP-BAL", "ACCT-CREDIT-LIMIT"], "given": "limit 1000.00, cycle credit 900.00, cycle debit 0.00; a payment of -200.00 followed by a purchase of 150.00", "when": "both are posted in one run", "then": "the payment posts (900-0-200 = 700) and cycle debit becomes -200.00; the purchase computes 900-(-200)+150 = 1250 > 1000 and is rejected with reason 102 although the net cycle spend would be 850.00. p06 proves the negative storage of ACCT-CURR-CYC-DEBIT (-325.50 after a -300.00 payment and -25.50 credit)", "fixtures": ["fixtures/posting/p06-credits-new-category"], "finding": "Looks wrong (sign convention mismatch between 2800-UPDATE-ACCOUNT-REC and the limit formula) but must be reproduced exactly.", "slice": "posting"}, {"id": "BR-POST-008", "title": "WS-TEMP-BAL truncates the high-order digit", "rule": "WS-TEMP-BAL is PIC S9(09)V99 while the cycle fields are S9(10)V99; COMPUTE has no ON SIZE ERROR, so a result of 1,000,000,000.00 or more silently loses its leading digit before the comparison.", "category": "edge-case", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 187, "endLine": 187}, {"file": "app/cbl/CBTRN02C.cbl", "startLine": 403, "endLine": 407}], "fields": ["WS-TEMP-BAL", "ACCT-CURR-CYC-CREDIT", "ACCT-CURR-CYC-DEBIT", "DALYTRAN-AMT"], "given": "ACCT-CREDIT-LIMIT 100.00, ACCT-CURR-CYC-CREDIT 1000000000.00, cycle debit 0.00, amount 50.00", "when": "the transaction is validated", "then": "WS-TEMP-BAL holds 50.00 (1000000050.00 truncated), 100.00 >= 50.00, so the transaction is accepted instead of rejected", "fixtures": [], "finding": "Silent high-order truncation can let an overlimit transaction through; reproduce it (do not widen the field).", "slice": "posting"}, {"id": "BR-POST-009", "title": "Expiry check: expiration date >= origin date, compared as text", "rule": "ACCT-EXPIRAION-DATE (X(10)) is compared alphanumerically with DALYTRAN-ORIG-TS(1:10); the transaction passes when expiry >= origin date (same-day accepted), else reason 103 'TRANSACTION RECEIVED AFTER ACCT EXPIRATION'. Because it is a character comparison, a blank or '0000-00-00' expiry date always fails and non-ISO dates compare lexically.", "category": "validation", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 414, "endLine": 420}, {"file": "app/cpy/CVACT01Y.cpy", "startLine": 11, "endLine": 11}, {"file": "app/cpy/CVTRA06Y.cpy", "startLine": 16, "endLine": 16}], "fields": ["ACCT-EXPIRAION-DATE", "DALYTRAN-ORIG-TS"], "given": "account 1004 expires 2022-01-31 and account 1005 expires 2022-07-04; both receive a transaction with origin 2022-07-04-09.15.00.000000", "when": "the transactions are validated", "then": "1004's is rejected with '0103TRANSACTION RECEIVED AFTER ACCT EXPIRATION'; 1005's posts (2022-07-04 >= 2022-07-04)", "fixtures": ["fixtures/posting/p05-expired-account"], "finding": null, "slice": "posting"}, {"id": "BR-POST-010", "title": "Overlimit reason is overwritten by expiry reason", "rule": "The limit and expiry checks are independent IFs; both run whenever the account exists. If both fail, the later MOVE wins, so the reject carries 103 only and the 102 condition is not reported.", "category": "validation", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 407, "endLine": 420}], "fields": ["WS-VALIDATION-FAIL-REASON", "WS-VALIDATION-FAIL-REASON-DESC"], "given": "an expired account (expiry 2022-01-31) that is also over its limit", "when": "a 2022-07-04 transaction is validated", "then": "one reject with trailer '0103TRANSACTION RECEIVED AFTER ACCT EXPIRATION'; no 0102 record", "fixtures": [], "finding": "Only the last failing reason is recorded; reproduce the 103-over-102 precedence.", "slice": "posting"}, {"id": "BR-POST-011", "title": "No active-status, cash-limit or type/category validation", "rule": "Posting does not test ACCT-ACTIVE-STATUS, ACCT-CASH-CREDIT-LIMIT, or whether the type/category code exists: cash advances count against the general credit limit only, and inactive accounts are posted normally.", "category": "validation", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 370, "endLine": 378}, {"file": "app/cpy/CVACT01Y.cpy", "startLine": 6, "endLine": 9}], "fields": ["ACCT-ACTIVE-STATUS", "ACCT-CASH-CREDIT-LIMIT", "DALYTRAN-TYPE-CD", "DALYTRAN-CAT-CD"], "given": "account 1006 (cash credit limit 2000.00) and a type 01 / category 0002 'Cash advance at ATM' of 60.00", "when": "CBTRN02C runs", "then": "the cash advance posts with no cash-limit test and a new TCATBAL record (1006,01,0002) is created", "fixtures": ["fixtures/posting/p06-credits-new-category"], "finding": "Missing validations (inactive accounts and cash limit are ignored) must be reproduced, not added.", "slice": "posting"}, {"id": "BR-POST-012", "title": "430-byte reject record", "rule": "A rejected transaction is written to DALYREJS(+1) (RECFM=F, LRECL=430) as the 350-byte DALYTRAN-RECORD copied unchanged followed by the 80-byte trailer: reason PIC 9(04) zero-padded (0100..0103) and a 76-byte description padded with spaces.", "category": "data-mapping", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 81, "endLine": 84}, {"file": "app/cbl/CBTRN02C.cbl", "startLine": 176, "endLine": 182}, {"file": "app/cbl/CBTRN02C.cbl", "startLine": 446, "endLine": 451}, {"file": "app/jcl/POSTTRAN.jcl", "startLine": 34, "endLine": 38}, {"file": "tools/parity/layouts/REJTRAN.cpy", "startLine": 7, "endLine": 24}], "fields": ["REJECT-TRAN-DATA", "VALIDATION-TRAILER", "WS-VALIDATION-FAIL-REASON", "WS-VALIDATION-FAIL-REASON-DESC", "REJ-FAIL-REASON", "REJ-FAIL-REASON-DESC"], "given": "the invalid-card transaction of p02", "when": "it is rejected", "then": "DALYREJS.G0001V00 holds one 430-byte record: the original 350 bytes (including its DALYTRAN-PROC-TS) then '0100INVALID CARD NUMBER FOUND' padded to 80", "fixtures": ["fixtures/posting/p02-invalid-card", "fixtures/posting/p03-account-missing", "fixtures/posting/p05-expired-account"], "finding": null, "slice": "posting"}, {"id": "BR-POST-013", "title": "Rejected transactions change no master file", "rule": "A record with a non-zero reason only increments WS-REJECT-COUNT and is written to DALYREJS; TCATBALF, ACCTDATA and TRANSACT are not touched for it.", "category": "state-change", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 211, "endLine": 216}], "fields": ["WS-REJECT-COUNT", "TRAN-CAT-BAL", "ACCT-CURR-BAL", "TRAN-RECORD"], "given": "p04: one accepted 50.00 and one rejected 100.00 purchase on account 1003 (balance 950.00, TCATBAL 950.00)", "when": "CBTRN02C runs", "then": "ACCT-CURR-BAL and TRAN-CAT-BAL both end at 1000.00 and TRANSACT holds 1 record", "fixtures": ["fixtures/posting/p04-overlimit-reject"], "finding": null, "slice": "posting"}, {"id": "BR-POST-014", "title": "Return code 4 when any record is rejected", "rule": "After closing all files, RETURN-CODE is set to 4 if WS-REJECT-COUNT > 0; otherwise it stays 0. Rejects never stop the run. TRANREPT still runs after RC 4 (no COND on the job).", "category": "return-code", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 229, "endLine": 231}, {"file": "app/cbl/CBTRN02C.cbl", "startLine": 234, "endLine": 234}], "fields": ["WS-REJECT-COUNT", "RETURN-CODE"], "given": "a daily file with 1 reject among 2 records", "when": "POSTTRAN runs", "then": "rc.json POSTTRAN STEP15 = 4 (maxrc 4); with zero rejects (p01) STEP15 = 0", "fixtures": ["fixtures/posting/p02-invalid-card", "fixtures/posting/p04-overlimit-reject", "fixtures/posting/p01-baseline-mixed"], "finding": null, "slice": "posting"}, {"id": "BR-POST-015", "title": "Posted transaction record mapping", "rule": "For an accepted record, TRAN-RECORD gets ID, type, category, source, description, amount, merchant id/name/city/zip, card number and ORIG-TS copied field by field from DALYTRAN-RECORD; DALYTRAN-PROC-TS is ignored and replaced (BR-POST-016). The record is written to the TRANSACT KSDS keyed by TRAN-ID.", "category": "data-mapping", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 424, "endLine": 436}, {"file": "app/cpy/CVTRA05Y.cpy", "startLine": 4, "endLine": 18}, {"file": "app/cpy/CVTRA06Y.cpy", "startLine": 4, "endLine": 18}], "fields": ["TRAN-ID", "TRAN-TYPE-CD", "TRAN-CAT-CD", "TRAN-SOURCE", "TRAN-DESC", "TRAN-AMT", "TRAN-MERCHANT-ID", "TRAN-MERCHANT-NAME", "TRAN-MERCHANT-CITY", "TRAN-MERCHANT-ZIP", "TRAN-CARD-NUM", "TRAN-ORIG-TS"], "given": "DALYTRAN 0000000000000001 'Bookshop purchase' 125.00 card 4000000000001001 origin 2022-07-04-09.15.00.000000", "when": "it is posted", "then": "TRANSACT record 0000000000000001 carries the same field values, ORIG-TS 2022-07-04-09.15.00.000000", "fixtures": ["fixtures/posting/p01-baseline-mixed"], "finding": null, "slice": "posting"}, {"id": "BR-POST-016", "title": "PROC-TS from the frozen clock in DB2 timestamp format", "rule": "TRAN-PROC-TS is built from FUNCTION CURRENT-DATE as YYYY-MM-DD-HH.MM.SS.hh0000 (hundredths of a second followed by literal '0000'). With the chain clock 2022-07-05 10:00:00.00 every posted record gets '2022-07-05-10.00.00.000000'.", "category": "data-mapping", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 149, "endLine": 174}, {"file": "app/cbl/CBTRN02C.cbl", "startLine": 437, "endLine": 438}, {"file": "app/cbl/CBTRN02C.cbl", "startLine": 692, "endLine": 705}], "fields": ["TRAN-PROC-TS", "COBOL-TS", "DB2-FORMAT-TS", "DB2-MIL", "DB2-REST"], "given": "COB_CURRENT_DATE=2022-07-05 10:00:00.00", "when": "any transaction is posted", "then": "its TRAN-PROC-TS is 2022-07-05-10.00.00.000000", "fixtures": ["fixtures/posting/p01-baseline-mixed", "fixtures/posting/p06-credits-new-category"], "finding": null, "slice": "posting"}, {"id": "BR-POST-017", "title": "Update order: TCATBAL, then account, then TRANSACT", "rule": "2000-POST-TRANSACTION performs 2700-UPDATE-TCATBAL, then 2800-UPDATE-ACCOUNT-REC, then 2900-WRITE-TRANSACTION-FILE. There is no rollback: a later failure leaves the earlier updates in place (BR-POST-024).", "category": "control-flow", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 440, "endLine": 442}], "fields": ["TRAN-CAT-BAL-RECORD", "ACCOUNT-RECORD", "TRAN-RECORD"], "given": "a valid purchase of 125.00 on account 1001", "when": "it is posted", "then": "TCATBAL (1001,01,0001) goes 500.00 -> 625.00, ACCT-CURR-BAL 500.00 -> 425.00 after the whole day, and the TRANSACT record is written last", "fixtures": ["fixtures/posting/p01-baseline-mixed"], "finding": null, "slice": "posting"}, {"id": "BR-POST-018", "title": "TCATBAL update of an existing category balance", "rule": "The TCATBAL key is XREF-ACCT-ID (11) + DALYTRAN-TYPE-CD (2) + DALYTRAN-CAT-CD (4). If the record exists, DALYTRAN-AMT is added to TRAN-CAT-BAL (signed, no rounding) and the record is REWRITten. A read status other than '00' or '23' displays 'ERROR READING TRANSACTION BALANCE FILE' and abends; a REWRITE failure displays 'ERROR REWRITING TRANSACTION BALANCE FILE' and abends.", "category": "state-change", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 467, "endLine": 501}, {"file": "app/cbl/CBTRN02C.cbl", "startLine": 526, "endLine": 542}, {"file": "app/cpy/CVTRA01Y.cpy", "startLine": 4, "endLine": 10}], "fields": ["FD-TRANCAT-ACCT-ID", "FD-TRANCAT-TYPE-CD", "FD-TRANCAT-CD", "TRAN-CAT-BAL"], "given": "TCATBAL (1001,02,0001) = 0.00 and a payment of -200.00 on card 4000000000001001", "when": "it is posted", "then": "TRAN-CAT-BAL for 00000001001020001 becomes -200.00", "fixtures": ["fixtures/posting/p01-baseline-mixed"], "finding": null, "slice": "posting"}, {"id": "BR-POST-019", "title": "TCATBAL creation for a new account/type/category", "rule": "When the TCATBAL READ raises INVALID KEY (status '23'), CBTRN02C displays 'TCATBAL record not found for key : ' + the 17-character key + '.. Creating.', INITIALIZEs TRAN-CAT-BAL-RECORD, sets the key, adds the amount to the zeroed balance and WRITEs a new record. A WRITE failure displays 'ERROR WRITING TRANSACTION BALANCE FILE' and abends.", "category": "state-change", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 473, "endLine": 479}, {"file": "app/cbl/CBTRN02C.cbl", "startLine": 495, "endLine": 499}, {"file": "app/cbl/CBTRN02C.cbl", "startLine": 503, "endLine": 524}], "fields": ["TRAN-CAT-KEY", "TRANCAT-ACCT-ID", "TRANCAT-TYPE-CD", "TRANCAT-CD", "TRAN-CAT-BAL"], "given": "account 1006 has only TCATBAL (1006,01,0001); transactions with type/cat 02/0001 (-300.00), 03/0001 (-25.50) and 01/0002 (60.00)", "when": "CBTRN02C runs", "then": "SYSOUT shows 'TCATBAL record not found for key : 00000001006020001.. Creating.' and the same for 030001 and 010002; TCATBALF gains records with balances -300.00, -25.50 and 60.00", "fixtures": ["fixtures/posting/p06-credits-new-category"], "finding": null, "slice": "posting"}, {"id": "BR-POST-020", "title": "Account balance and cycle-bucket update", "rule": "DALYTRAN-AMT is added to ACCT-CURR-BAL. If the amount is >= 0 (zero included) it is added to ACCT-CURR-CYC-CREDIT, otherwise the negative amount is added to ACCT-CURR-CYC-DEBIT, so that field accumulates negative values. The account record is then REWRITten.", "category": "state-change", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 545, "endLine": 554}, {"file": "app/cpy/CVACT01Y.cpy", "startLine": 7, "endLine": 7}, {"file": "app/cpy/CVACT01Y.cpy", "startLine": 13, "endLine": 14}], "fields": ["ACCT-CURR-BAL", "ACCT-CURR-CYC-CREDIT", "ACCT-CURR-CYC-DEBIT", "DALYTRAN-AMT"], "given": "account 1001 with balance 500.00, cycle credit 0.00, cycle debit 0.00; posts of +125.00 and -200.00", "when": "CBTRN02C runs", "then": "ACCT-CURR-BAL 425.00, ACCT-CURR-CYC-CREDIT 125.00, ACCT-CURR-CYC-DEBIT -200.00", "fixtures": ["fixtures/posting/p01-baseline-mixed", "fixtures/posting/p06-credits-new-category"], "finding": null, "slice": "posting"}, {"id": "BR-POST-021", "title": "Account REWRITE failure reason 109 is never acted on", "rule": "If the account REWRITE raises INVALID KEY, reason 109 'ACCOUNT RECORD NOT FOUND' is moved to the trailer, but nothing tests it afterwards: the TRANSACT record is still written, no reject record is produced, WS-REJECT-COUNT and the RC are unchanged, and the reason is reset for the next record.", "category": "edge-case", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 554, "endLine": 559}, {"file": "app/cbl/CBTRN02C.cbl", "startLine": 208, "endLine": 216}], "fields": ["WS-VALIDATION-FAIL-REASON", "WS-VALIDATION-FAIL-REASON-DESC"], "given": "an account REWRITE that returns INVALID KEY after a successful read", "when": "the transaction is posted", "then": "the transaction is still written to TRANSACT, DALYREJS gets nothing, TRANSACTIONS REJECTED is unchanged and RC stays 0", "fixtures": [], "finding": "Dead error handling (code 109 is set but ignored); reproduce it, do not turn it into a reject.", "slice": "posting"}, {"id": "BR-POST-022", "title": "Amounts are exact: no rounding anywhere in posting", "rule": "All posting arithmetic (ADD to TRAN-CAT-BAL, ACCT-CURR-BAL, cycle fields) works on two-decimal zoned fields with no ROUNDED phrase and no division, so results are exact to the cent; signs travel as zoned overpunch (e.g. '0000000157N' = -15.75, '0000001250{' = +125.00). Half cents cannot occur because input amounts have 2 decimals.", "category": "rounding", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 508, "endLine": 508}, {"file": "app/cbl/CBTRN02C.cbl", "startLine": 527, "endLine": 527}, {"file": "app/cbl/CBTRN02C.cbl", "startLine": 547, "endLine": 552}, {"file": "app/cpy/CVTRA06Y.cpy", "startLine": 10, "endLine": 10}], "fields": ["DALYTRAN-AMT", "TRAN-AMT", "TRAN-CAT-BAL", "ACCT-CURR-BAL"], "given": "a refund of -15.75 (zoned '0000000157N') and a purchase of 80.25 ('0000000802E') on account 1002 with balance 120.05", "when": "they are posted", "then": "ACCT-CURR-BAL becomes 126.50 ('00000012650{'), ACCT-CURR-CYC-DEBIT -15.75 ('00000000157N')", "fixtures": ["fixtures/posting/p01-baseline-mixed"], "finding": null, "slice": "posting"}, {"id": "BR-POST-023", "title": "TRANSACT is opened OUTPUT", "rule": "CBTRN02C opens the TRANSACT KSDS with OPEN OUTPUT (not I-O/EXTEND), so the run creates the file contents afresh; any rows loaded by the TRANFILE setup job from DALYTRAN.PS.INIT are not carried forward off-host. After posting the file holds exactly the accepted transactions of the day, in TRAN-ID key order.", "category": "state-change", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 254, "endLine": 270}, {"file": "app/jcl/TRANFILE.jcl", "startLine": 67, "endLine": 74}], "fields": ["TRAN-RECORD", "TRANFILE-STATUS"], "given": "an empty DALYTRAN.PS.INIT and 4 valid daily transactions", "when": "POSTTRAN runs", "then": "TRANSACT holds 4 records (manifest records: 4) keyed 0000000000000001..0000000000000004", "fixtures": ["fixtures/posting/p01-baseline-mixed", "fixtures/posting/p07-empty-day"], "finding": "On z/OS OPEN OUTPUT on a loaded KSDS behaves differently unless the cluster is REUSE; the fixtures always start TRANSACT empty, so reproduce the off-host 'only today's postings' result.", "slice": "posting"}, {"id": "BR-POST-024", "title": "TRANSACT write failure abends after partial updates", "rule": "If WRITE to TRANSACT fails (e.g. duplicate TRAN-ID, status '22'), CBTRN02C displays 'ERROR WRITING TO TRANSACTION FILE', the file status line and 'ABENDING PROGRAM', then abends. The TCATBAL and account updates for that record are already rewritten, files are not closed by the program and the counter/END lines are not displayed.", "category": "edge-case", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 562, "endLine": 579}, {"file": "app/cbl/CBTRN02C.cbl", "startLine": 440, "endLine": 442}], "fields": ["TRAN-ID", "TRANFILE-STATUS", "IO-STATUS"], "given": "two daily records with the same TRAN-ID 0000000000000001", "when": "the second is posted", "then": "SYSOUT ends with ERROR WRITING TO TRANSACTION FILE / FILE STATUS IS: NNNN0022 / ABENDING PROGRAM and the step ends abnormally (RC 12 via the off-host CEE3ABD stand-in); TCATBAL and ACCT already include the second amount", "fixtures": [], "finding": "No duplicate check and no rollback: balances are updated for a transaction that is never written. Reproduce.", "slice": "posting"}, {"id": "BR-POST-025", "title": "CBTRN02C I/O error messages", "rule": "Every open, read, write and close of the six files checks for status '00' (read also accepts '10' = EOF) and otherwise displays a file-specific message followed by the file-status line (BR-POST-027) and the abend (BR-POST-028). Messages: ERROR OPENING DALYTRAN, ERROR OPENING TRANSACTION FILE, ERROR OPENING CROSS REF FILE, ERROR OPENING DALY REJECTS FILE, ERROR OPENING ACCOUNT MASTER FILE, ERROR OPENING TRANSACTION BALANCE FILE, ERROR READING DALYTRAN FILE, ERROR WRITING TO REJECTS FILE, ERROR CLOSING DALYTRAN FILE, ERROR CLOSING TRANSACTION FILE, ERROR CLOSING CROSS REF FILE, ERROR CLOSING DAILY REJECTS FILE, ERROR CLOSING ACCOUNT FILE, ERROR CLOSING TRANSACTION BALANCE FILE.", "category": "sysout", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 236, "endLine": 343}, {"file": "app/cbl/CBTRN02C.cbl", "startLine": 357, "endLine": 368}, {"file": "app/cbl/CBTRN02C.cbl", "startLine": 457, "endLine": 464}, {"file": "app/cbl/CBTRN02C.cbl", "startLine": 582, "endLine": 690}], "fields": ["DALYTRAN-STATUS", "TRANFILE-STATUS", "XREFFILE-STATUS", "DALYREJS-STATUS", "ACCTFILE-STATUS", "TCATBALF-STATUS"], "given": "the ACCTFILE KSDS is missing (open status '35')", "when": "CBTRN02C starts", "then": "SYSOUT: START OF EXECUTION OF PROGRAM CBTRN02C / ERROR OPENING ACCOUNT MASTER FILE / FILE STATUS IS: NNNN0035 / ABENDING PROGRAM", "fixtures": [], "finding": null, "slice": "posting"}, {"id": "BR-POST-026", "title": "DALYREJS close error reports the XREF file status", "rule": "9300-DALYREJS-CLOSE checks DALYREJS-STATUS but moves XREFFILE-STATUS into IO-STATUS before displaying it, so the printed file status belongs to the cross-reference file (normally '00').", "category": "sysout", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 637, "endLine": 653}], "fields": ["DALYREJS-STATUS", "XREFFILE-STATUS", "IO-STATUS"], "given": "CLOSE of DALYREJS fails with status '30' after XREFFILE closed with '00'", "when": "9300-DALYREJS-CLOSE runs", "then": "SYSOUT: ERROR CLOSING DAILY REJECTS FILE / FILE STATUS IS: NNNN0000 / ABENDING PROGRAM", "fixtures": [], "finding": "Copy-paste defect: wrong status variable displayed. Reproduce it.", "slice": "posting"}, {"id": "BR-POST-027", "title": "File-status display format", "rule": "9910-DISPLAY-IO-STATUS prints 'FILE STATUS IS: NNNN' followed by a 4-character code: for a numeric status not starting with '9' it is '00' + the 2-digit status (e.g. NNNN0023); for a non-numeric status or one starting with '9' it is the first status byte followed by the 3-digit binary value of the second byte (e.g. status '9' + X'04' -> NNNN9004). Same routine in both programs.", "category": "sysout", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 131, "endLine": 140}, {"file": "app/cbl/CBTRN02C.cbl", "startLine": 714, "endLine": 727}, {"file": "app/cbl/CBTRN03C.cbl", "startLine": 633, "endLine": 646}], "fields": ["IO-STATUS", "IO-STAT1", "IO-STAT2", "IO-STATUS-04", "TWO-BYTES-BINARY"], "given": "IO-STATUS = '23'", "when": "9910-DISPLAY-IO-STATUS runs", "then": "SYSOUT line 'FILE STATUS IS: NNNN0023'", "fixtures": [], "finding": null, "slice": "posting"}, {"id": "BR-POST-028", "title": "Abend via CEE3ABD with code 999", "rule": "9999-ABEND-PROGRAM displays 'ABENDING PROGRAM' and calls CEE3ABD with ABCODE 999 and TIMING 0 (user abend U999 on z/OS). Off-host the CEE3ABD stand-in (tools/stubs/CEE3ABD.cbl) displays the abend code and stops the run with RC 12; GnuCOBOL may then add 'libcob: warning: implicit CLOSE' runtime lines, which are not program output. Identical in CBTRN02C and CBTRN03C.", "category": "return-code", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 147, "endLine": 148}, {"file": "app/cbl/CBTRN02C.cbl", "startLine": 707, "endLine": 711}, {"file": "app/cbl/CBTRN03C.cbl", "startLine": 626, "endLine": 630}], "fields": ["ABCODE", "TIMING", "RETURN-CODE"], "given": "any unrecoverable I/O error", "when": "9999-ABEND-PROGRAM runs", "then": "SYSOUT 'ABENDING PROGRAM', the step ends with abend U999 (RC 12 off-host) and no END OF EXECUTION line", "fixtures": [], "finding": null, "slice": "posting"}, {"id": "BR-POST-029", "title": "Empty daily file posts nothing", "rule": "If DALYTRAN is empty the first read returns '10'; counters stay zero, nothing is written to TRANSACT or DALYREJS, ACCTDATA and TCATBALF are unchanged, RC is 0 and DALYREJS(+1) is still catalogued as an empty generation.", "category": "edge-case", "sources": [{"file": "app/cbl/CBTRN02C.cbl", "startLine": 202, "endLine": 234}, {"file": "app/jcl/POSTTRAN.jcl", "startLine": 34, "endLine": 38}], "fields": ["WS-TRANSACTION-COUNT", "WS-REJECT-COUNT", "RETURN-CODE"], "given": "an empty AWS.M2.CARDDEMO.DALYTRAN.PS", "when": "POSTTRAN runs", "then": "SYSOUT TRANSACTIONS PROCESSED :000000000 / TRANSACTIONS REJECTED  :000000000; STEP15 RC 0; TRANSACT and DALYREJS.G0001V00 have 0 records", "fixtures": ["fixtures/posting/p07-empty-day"], "finding": null, "slice": "posting"}, {"id": "BR-POST-030", "title": "TRANREPT unloads TRANSACT with IDCAMS REPRO", "rule": "TRANREPT's first step (STEP05R, proc REPROC, proc step PRC001) runs IDCAMS 'REPRO INFILE(FILEIN) OUTFILE(FILEOUT)' copying the TRANSACT KSDS in key (TRAN-ID) order into a new generation TRANSACT.BKUP(+1), RECFM=FB LRECL=350. The SORT step that follows is also named STEP05R.", "category": "control-flow", "sources": [{"file": "app/jcl/TRANREPT.jcl", "startLine": 19, "endLine": 33}, {"file": "app/proc/REPROC.prc", "startLine": 21, "endLine": 28}, {"file": "app/ctl/REPROCT.ctl", "startLine": 15, "endLine": 15}], "fields": ["TRAN-RECORD", "TRAN-ID"], "given": "TRANSACT holds the 4 postings of p01", "when": "TRANREPT runs", "then": "TRANSACT.BKUP.G0001V00 holds the same 4 records in TRAN-ID order; rc.json lists PRC001 = 0 and STEP05R = 0", "fixtures": ["fixtures/posting/p01-baseline-mixed"], "finding": "Two steps share the name STEP05R (the REPRO proc step and the SORT step), which makes step references ambiguous; keep the step names as recorded in rc.json.", "slice": "posting"}, {"id": "BR-POST-031", "title": "SORT window is hard-coded in JCL SYMNAMES", "rule": "The DFSORT step keeps only records whose TRAN-PROC-DT (bytes 305-314 of TRAN-PROC-TS, CH) is >= '2022-01-01' and <= '2022-07-06' (inclusive). The bounds are literals in SYMNAMES, not taken from DATEPARM, so changing DATEPARM does not change which records reach CBTRN03C.", "category": "validation", "sources": [{"file": "app/jcl/TRANREPT.jcl", "startLine": 40, "endLine": 48}], "fields": ["TRAN-PROC-TS"], "given": "postings with TRAN-PROC-TS 2022-07-05-10.00.00.000000 (frozen clock)", "when": "the SORT runs", "then": "all records are included (2022-07-05 is inside 2022-01-01..2022-07-06); a record with proc date 2022-07-07 would be dropped regardless of DATEPARM", "fixtures": ["fixtures/posting/p01-baseline-mixed"], "finding": "Report window is hard-coded in the JCL and duplicated in DATEPARM; reproduce the literal window.", "slice": "posting"}, {"id": "BR-POST-032", "title": "SORT by card number, stable", "rule": "SORT FIELDS=(TRAN-CARD-NUM,A) with TRAN-CARD-NUM at position 263 length 16 (ZD) orders the daily file by card; records with the same card keep their incoming TRAN-ID order. Output goes to TRANSACT.DALY(+1) with the SORTIN DCB.", "category": "control-flow", "sources": [{"file": "app/jcl/TRANREPT.jcl", "startLine": 37, "endLine": 46}, {"file": "app/jcl/TRANREPT.jcl", "startLine": 51, "endLine": 55}], "fields": ["TRAN-CARD-NUM", "TRAN-ID"], "given": "p01 postings 1 and 3 on card ...1001 and 2 and 4 on card ...1002", "when": "the SORT runs", "then": "TRANSACT.DALY order is 0000000000000001, 0000000000000003, 0000000000000002, 0000000000000004", "fixtures": ["fixtures/posting/p01-baseline-mixed"], "finding": null, "slice": "posting"}, {"id": "BR-POST-033", "title": "CBTRN03C SYSOUT banners and DATEPARM echo", "rule": "CBTRN03C displays 'START OF EXECUTION OF PROGRAM CBTRN03C', opens its six files, reads the single 80-byte DATEPARM record (start date bytes 1-10, one filler byte, end date bytes 12-21) and displays 'Reporting from ' start ' to ' end. At the end it displays 'END OF EXECUTION OF PROGRAM CBTRN03C'. STEP10R ends RC 0 unless it abends.", "category": "sysout", "sources": [{"file": "app/cbl/CBTRN03C.cbl", "startLine": 122, "endLine": 125}, {"file": "app/cbl/CBTRN03C.cbl", "startLine": 160, "endLine": 168}, {"file": "app/cbl/CBTRN03C.cbl", "startLine": 215, "endLine": 215}, {"file": "app/cbl/CBTRN03C.cbl", "startLine": 220, "endLine": 233}], "fields": ["WS-START-DATE", "WS-END-DATE", "FD-DATEPARM-REC"], "given": "DATEPARM '2022-01-01 2022-07-06'", "when": "STEP10R runs", "then": "SYSOUT line 2 is 'Reporting from 2022-01-01 to 2022-07-06'; rc.json STEP10R = 0", "fixtures": ["fixtures/posting/p01-baseline-mixed", "fixtures/posting/p07-empty-day"], "finding": null, "slice": "posting"}, {"id": "BR-POST-034", "title": "Empty DATEPARM ends the report before any record", "rule": "If the DATEPARM read returns '10' (empty file), END-OF-FILE is set to 'Y', no 'Reporting from' line is displayed and the main loop never executes: no transaction is read and the report is empty. Any other non-'00' status displays 'ERROR READING DATEPARM FILE' and abends.", "category": "edge-case", "sources": [{"file": "app/cbl/CBTRN03C.cbl", "startLine": 220, "endLine": 243}, {"file": "app/cbl/CBTRN03C.cbl", "startLine": 170, "endLine": 171}], "fields": ["DATEPARM-STATUS", "END-OF-FILE"], "given": "an empty AWS.M2.CARDDEMO.DATEPARM and 4 sorted transactions", "when": "STEP10R runs", "then": "SYSOUT has only the START and END lines; TRANREPT(+1) has 0 records; RC 0", "fixtures": [], "finding": null, "slice": "posting"}, {"id": "BR-POST-035", "title": "Every reported record is echoed to SYSOUT", "rule": "Before formatting, CBTRN03C displays the full 350-byte TRAN-RECORD as raw text (zoned amounts with overpunch, e.g. '0000001250{') for every in-window record.", "category": "sysout", "sources": [{"file": "app/cbl/CBTRN03C.cbl", "startLine": 179, "endLine": 180}], "fields": ["TRAN-RECORD"], "given": "p01's 4 sorted transactions", "when": "STEP10R runs", "then": "SYSOUT lines 3-6 are the 4 raw 350-byte records in card order, the first starting '0000000000000001010001POS TERM  Bookshop purchase'", "fixtures": ["fixtures/posting/p01-baseline-mixed"], "finding": null, "slice": "posting"}, {"id": "BR-POST-036", "title": "Out-of-window record ends the report via NEXT SENTENCE", "rule": "CBTRN03C re-tests TRAN-PROC-TS(1:10) against the DATEPARM window. For a record outside it the code executes NEXT SENTENCE, which jumps past the period after END-PERFORM, so the read loop ends at once: that record and all later ones are skipped and no page, account or grand totals are written.", "category": "control-flow", "sources": [{"file": "app/cbl/CBTRN03C.cbl", "startLine": 170, "endLine": 178}, {"file": "app/cbl/CBTRN03C.cbl", "startLine": 206, "endLine": 208}], "fields": ["TRAN-PROC-TS", "WS-START-DATE", "WS-END-DATE"], "given": "DATEPARM '2022-07-06 2022-07-06' and sorted postings with proc date 2022-07-05 (inside the SORT window)", "when": "STEP10R runs", "then": "the first record fails the test, the loop exits, TRANREPT(+1) has 0 records and SYSOUT shows only START, 'Reporting from 2022-07-06 to 2022-07-06' and END", "fixtures": [], "finding": "NEXT SENTENCE inside an inline PERFORM acts as 'stop processing' rather than 'skip this record'; reproduce it.", "slice": "posting"}, {"id": "BR-POST-037", "title": "Empty day produces a zero-record report", "rule": "When TRANSACT.DALY is empty, the first read hits EOF while TRAN-RECORD is still its initial blank value; the blank TRAN-PROC-TS fails the date test, NEXT SENTENCE leaves the loop and the EOF totals branch never runs. The report has no headers, no totals, and SYSOUT has no TRAN-AMT / WS-PAGE-TOTAL lines.", "category": "edge-case", "sources": [{"file": "app/cbl/CBTRN03C.cbl", "startLine": 170, "endLine": 206}], "fields": ["TRAN-RECORD", "TRAN-PROC-TS", "END-OF-FILE"], "given": "no daily transactions (p07)", "when": "TRANREPT runs", "then": "TRANREPT.G0001V00 has 0 records (manifest records: 0); SYSOUT is START / Reporting from 2022-01-01 to 2022-07-06 / END; STEP10R RC 0", "fixtures": ["fixtures/posting/p07-empty-day"], "finding": "The fixture README says headers are produced, but the golden output has 0 records; the golden file wins and the empty report must be reproduced.", "slice": "posting"}, {"id": "BR-POST-038", "title": "Report header block and 133-byte records", "rule": "Before the first detail line CBTRN03C writes REPORT-NAME-HEADER ('DALYREPT' in 38 bytes, 'Daily Transaction Report' in 41, 'Date Range: ', start, ' to ', end = 115 bytes), a blank line, TRANSACTION-HEADER-1 (column titles) and TRANSACTION-HEADER-2 (133 dashes), adding 4 to WS-LINE-COUNTER. Every report record is padded with spaces to LRECL 133 (RECFM=FB).", "category": "data-mapping", "sources": [{"file": "app/cbl/CBTRN03C.cbl", "startLine": 84, "endLine": 85}, {"file": "app/cbl/CBTRN03C.cbl", "startLine": 274, "endLine": 280}, {"file": "app/cbl/CBTRN03C.cbl", "startLine": 324, "endLine": 341}, {"file": "app/cpy/CVTRA07Y.cpy", "startLine": 4, "endLine": 13}, {"file": "app/cpy/CVTRA07Y.cpy", "startLine": 33, "endLine": 48}, {"file": "app/jcl/TRANREPT.jcl", "startLine": 76, "endLine": 80}], "fields": ["REPORT-NAME-HEADER", "REPT-START-DATE", "REPT-END-DATE", "TRANSACTION-HEADER-1", "TRANSACTION-HEADER-2", "WS-LINE-COUNTER"], "given": "DATEPARM 2022-01-01 / 2022-07-06 and at least one in-window transaction", "when": "the first detail is written", "then": "report lines 1-4: 'DALYREPT ... Daily Transaction Report ... Date Range: 2022-01-01 to 2022-07-06', blank, 'Transaction ID   Account ID  Transaction Type   Tran Category                      Tran Source            Amount', 133 dashes", "fixtures": ["fixtures/posting/p01-baseline-mixed"], "finding": null, "slice": "posting"}, {"id": "BR-POST-039", "title": "Detail line layout", "rule": "Each detail line is TRAN-ID (16), space, account id from XREF-ACCT-ID (11 digits), space, type code '-' type description truncated to 15, space, category code (4) '-' category description truncated to 29, space, TRAN-SOURCE (10), 4 spaces, TRAN-AMT edited -ZZZ,ZZZ,ZZZ.ZZ (leading '-' only for negatives, blank otherwise), 2 spaces. Descriptions come from random reads of TRANTYPE (by type) and TRANCATG (by type+category).", "category": "data-mapping", "sources": [{"file": "app/cbl/CBTRN03C.cbl", "startLine": 189, "endLine": 196}, {"file": "app/cbl/CBTRN03C.cbl", "startLine": 361, "endLine": 374}, {"file": "app/cpy/CVTRA07Y.cpy", "startLine": 15, "endLine": 31}], "fields": ["TRAN-REPORT-TRANS-ID", "TRAN-REPORT-ACCOUNT-ID", "TRAN-REPORT-TYPE-CD", "TRAN-REPORT-TYPE-DESC", "TRAN-REPORT-CAT-CD", "TRAN-REPORT-CAT-DESC", "TRAN-REPORT-SOURCE", "TRAN-REPORT-AMT", "TRAN-TYPE-DESC", "TRAN-CAT-TYPE-DESC"], "given": "posting 0000000000000003, account 1001, type 02 'Payment', category 0001 'Payment - Bank Transfer', source OPERATOR, amount -200.00", "when": "the detail is written", "then": "'0000000000000003 00000001001 02-Payment         0001-Payment - Bank Transfer       OPERATOR      -        200.00'", "fixtures": ["fixtures/posting/p01-baseline-mixed", "fixtures/posting/p06-credits-new-category"], "finding": null, "slice": "posting"}, {"id": "BR-POST-040", "title": "Card break writes the Account Total", "rule": "When TRAN-CARD-NUM differs from WS-CURR-CARD-NUM and this is not the first record, CBTRN03C writes 'Account Total' + 84 dots + WS-ACCOUNT-TOTAL edited +ZZZ,ZZZ,ZZZ.ZZ ('+' or '-' sign), then a line of 133 dashes, resets the account total and adds 2 to the line counter. It then looks the new card up in CARDXREF (account id for the detail lines).", "category": "calculation", "sources": [{"file": "app/cbl/CBTRN03C.cbl", "startLine": 181, "endLine": 188}, {"file": "app/cbl/CBTRN03C.cbl", "startLine": 306, "endLine": 316}, {"file": "app/cpy/CVTRA07Y.cpy", "startLine": 56, "endLine": 60}], "fields": ["WS-CURR-CARD-NUM", "WS-ACCOUNT-TOTAL", "REPT-ACCOUNT-TOTAL", "WS-FIRST-TIME"], "given": "card ...1001 with 125.00 and -200.00 followed by card ...1002", "when": "the first ...1002 record is processed", "then": "report line 'Account Total....................................................................................-         75.00' followed by 133 dashes", "fixtures": ["fixtures/posting/p01-baseline-mixed"], "finding": null, "slice": "posting"}, {"id": "BR-POST-041", "title": "Page break every 20 lines; line counter never resets", "rule": "Before each detail line, if MOD(WS-LINE-COUNTER, 20) = 0 the program writes the page total ('Page Total ' + 86 dots + total edited +ZZZ,ZZZ,ZZZ.ZZ) and a dash line, then the 4-line header block. WS-LINE-COUNTER is never reset and account-total breaks add 2 lines, so the counter can step over a multiple of 20 and the page then runs until the next multiple (e.g. 40).", "category": "control-flow", "sources": [{"file": "app/cbl/CBTRN03C.cbl", "startLine": 128, "endLine": 132}, {"file": "app/cbl/CBTRN03C.cbl", "startLine": 282, "endLine": 285}, {"file": "app/cbl/CBTRN03C.cbl", "startLine": 293, "endLine": 304}, {"file": "app/cbl/CBTRN03C.cbl", "startLine": 306, "endLine": 316}, {"file": "app/cpy/CVTRA07Y.cpy", "startLine": 50, "endLine": 54}], "fields": ["WS-LINE-COUNTER", "WS-PAGE-SIZE", "WS-PAGE-TOTAL"], "given": "the line counter is 19 after a detail and the next record starts a new card", "when": "the account total (+2 lines) is written", "then": "the counter reaches 21, MOD(21,20) <> 0, so no page break is taken at line 20; the next break happens when the counter is exactly 40", "fixtures": [], "finding": "Page size is not enforced consistently (counter not reset, account-total lines can skip the break); reproduce the counter arithmetic exactly.", "slice": "posting"}, {"id": "BR-POST-042", "title": "Page total rolls into the grand total", "rule": "Every detail adds TRAN-AMT to WS-PAGE-TOTAL and WS-ACCOUNT-TOTAL. Writing the page total adds WS-PAGE-TOTAL to WS-GRAND-TOTAL and resets the page total to 0; the grand total is only ever the sum of written page totals.", "category": "calculation", "sources": [{"file": "app/cbl/CBTRN03C.cbl", "startLine": 134, "endLine": 136}, {"file": "app/cbl/CBTRN03C.cbl", "startLine": 287, "endLine": 288}, {"file": "app/cbl/CBTRN03C.cbl", "startLine": 293, "endLine": 298}], "fields": ["WS-PAGE-TOTAL", "WS-ACCOUNT-TOTAL", "WS-GRAND-TOTAL"], "given": "p06: -300.00, -25.50 and 60.00 on one card, no page break", "when": "EOF totals are written", "then": "the page total -205.50 (with the BR-POST-043 double count) is added to the zero grand total and 'Grand Total' shows -205.50", "fixtures": ["fixtures/posting/p06-credits-new-category"], "finding": null, "slice": "posting"}, {"id": "BR-POST-043", "title": "EOF totals double-count the last amount and skip the last Account Total", "rule": "At end of file the READ INTO leaves the last record in TRAN-RECORD, so it passes the date test and the ELSE branch adds TRAN-AMT to the page and account totals a second time, then writes the page total (plus dash line) and the grand total. 1120-WRITE-ACCOUNT-TOTALS is not called, so the last card's Account Total never appears.", "category": "calculation", "sources": [{"file": "app/cbl/CBTRN03C.cbl", "startLine": 197, "endLine": 204}, {"file": "app/cbl/CBTRN03C.cbl", "startLine": 248, "endLine": 264}], "fields": ["TRAN-AMT", "WS-PAGE-TOTAL", "WS-ACCOUNT-TOTAL", "WS-GRAND-TOTAL"], "given": "p04: a single posted transaction of 50.00", "when": "TRANREPT runs", "then": "'Page Total' and 'Grand Total' show +100.00 instead of 50.00 and no Account Total line is written (8 report records); in p01 the totals are -26.25 instead of -10.50", "fixtures": ["fixtures/posting/p04-overlimit-reject", "fixtures/posting/p01-baseline-mixed", "fixtures/posting/p02-invalid-card"], "finding": "Last amount counted twice and last account total missing; the golden reports encode this, so reproduce it.", "slice": "posting"}, {"id": "BR-POST-044", "title": "EOF SYSOUT shows TRAN-AMT and the pre-adjustment page total", "rule": "In the EOF branch CBTRN03C displays 'TRAN-AMT ' + TRAN-AMT and 'WS-PAGE-TOTAL' (no separator) + WS-PAGE-TOTAL, both as 11 digits followed by a trailing sign character, before the double-count addition.", "category": "sysout", "sources": [{"file": "app/cbl/CBTRN03C.cbl", "startLine": 198, "endLine": 199}], "fields": ["TRAN-AMT", "WS-PAGE-TOTAL"], "given": "p01, last record -15.75, running page total -10.50", "when": "EOF is reached", "then": "SYSOUT lines 'TRAN-AMT 00000001575-' and 'WS-PAGE-TOTAL00000001050-'", "fixtures": ["fixtures/posting/p01-baseline-mixed", "fixtures/posting/p06-credits-new-category"], "finding": null, "slice": "posting"}, {"id": "BR-POST-045", "title": "Grand Total line", "rule": "1110-WRITE-GRAND-TOTALS writes 'Grand Total' + 86 dots + WS-GRAND-TOTAL edited +ZZZ,ZZZ,ZZZ.ZZ as the last report line; it does not add a dash line or update counters.", "category": "data-mapping", "sources": [{"file": "app/cbl/CBTRN03C.cbl", "startLine": 318, "endLine": 322}, {"file": "app/cpy/CVTRA07Y.cpy", "startLine": 62, "endLine": 66}], "fields": ["WS-GRAND-TOTAL", "REPT-GRAND-TOTAL"], "given": "p01 page total -26.25 at EOF", "when": "grand totals are written", "then": "last report line 'Grand Total......................................................................................-         26.25'", "fixtures": ["fixtures/posting/p01-baseline-mixed"], "finding": null, "slice": "posting"}, {"id": "BR-POST-046", "title": "CBTRN03C lookup failures abend", "rule": "If the card is not in CARDXREF, the type not in TRANTYPE, or type+category not in TRANCATG, CBTRN03C displays 'INVALID CARD NUMBER : ' / 'INVALID TRANSACTION TYPE : ' / 'INVALID TRAN CATG KEY : ' with the key, forces IO-STATUS 23 ('FILE STATUS IS: NNNN0023') and abends (BR-POST-028); partial report output already written remains.", "category": "return-code", "sources": [{"file": "app/cbl/CBTRN03C.cbl", "startLine": 484, "endLine": 512}], "fields": ["FD-XREF-CARD-NUM", "FD-TRAN-TYPE", "FD-TRAN-CAT-KEY", "IO-STATUS"], "given": "a posted transaction with type 01 / category 0009 that has no TRANCATG record", "when": "STEP10R reports it", "then": "SYSOUT 'INVALID TRAN CATG KEY : 010009' / 'FILE STATUS IS: NNNN0023' / 'ABENDING PROGRAM'; step ends abnormally (RC 12 off-host)", "fixtures": [], "finding": null, "slice": "posting"}, {"id": "BR-POST-047", "title": "CBTRN03C I/O error messages", "rule": "Open, read, write and close failures display a file-specific message, the file-status line and abend: ERROR OPENING TRANFILE / REPTFILE / CROSS REF FILE / TRANSACTION TYPE FILE / TRANSACTION CATG FILE / DATE PARM FILE, ERROR READING TRANSACTION FILE, ERROR READING DATEPARM FILE, ERROR WRITING REPTFILE, ERROR CLOSING POSTED TRANSACTION FILE / REPORT FILE / CROSS REF FILE / TRANSACTION TYPE FILE / TRANSACTION CATG FILE / DATE PARM FILE.", "category": "sysout", "sources": [{"file": "app/cbl/CBTRN03C.cbl", "startLine": 248, "endLine": 272}, {"file": "app/cbl/CBTRN03C.cbl", "startLine": 343, "endLine": 359}, {"file": "app/cbl/CBTRN03C.cbl", "startLine": 376, "endLine": 482}, {"file": "app/cbl/CBTRN03C.cbl", "startLine": 514, "endLine": 621}], "fields": ["TRANFILE-STATUS", "TRANREPT-STATUS", "CARDXREF-STATUS", "TRANTYPE-STATUS", "TRANCATG-STATUS", "DATEPARM-STATUS"], "given": "the DATEPARM dataset is not allocated (open status '35')", "when": "STEP10R starts", "then": "SYSOUT: START OF EXECUTION OF PROGRAM CBTRN03C / ERROR OPENING DATE PARM FILE / FILE STATUS IS: NNNN0035 / ABENDING PROGRAM", "fixtures": [], "finding": null, "slice": "posting"}, {"id": "BR-INT-001", "title": "INTCALC STEP15 runs CBACT04C with PARM='2022071800'", "rule": "The INTCALC job has one step, STEP15, which runs CBACT04C with PARM='2022071800'. The program receives the z/OS parameter as EXTERNAL-PARMS (halfword PARM-LENGTH followed by PARM-DATE X(10)). Only PARM-DATE is used. PARM-LENGTH is never checked, so a short or missing PARM is not validated. Off-host, the PARMDRV stand-in rebuilds this structure from the command line.", "category": "control-flow", "sources": [{"file": "app/jcl/INTCALC.jcl", "startLine": 22, "endLine": 22}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 175, "endLine": 180}, {"file": "tools/stubs/PARMDRV.cbl", "startLine": 19, "endLine": 29}], "fields": ["PARM-LENGTH", "PARM-DATE"], "given": "INTCALC.jcl as shipped (PARM='2022071800')", "when": "the job runs", "then": "CBACT04C is called with PARM-LENGTH = 10 and PARM-DATE = '2022071800'; the first TRAN-ID starts with '2022071800'", "fixtures": ["fixtures/interest/i01-baseline"], "finding": null, "slice": "interest"}, {"id": "BR-INT-002", "title": "Start and end banners on SYSOUT", "rule": "The program writes 'START OF EXECUTION OF PROGRAM CBACT04C' to SYSOUT first. On a normal finish, after all files are closed, it writes 'END OF EXECUTION OF PROGRAM CBACT04C' and ends with GOBACK. An abending run never prints the end banner.", "category": "sysout", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 181, "endLine": 181}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 230, "endLine": 232}], "fields": [], "given": "any valid input set", "when": "CBACT04C completes normally", "then": "SYSOUT line 1 is 'START OF EXECUTION OF PROGRAM CBACT04C' and the last line is 'END OF EXECUTION OF PROGRAM CBACT04C'", "fixtures": ["fixtures/interest/i01-baseline"], "finding": null, "slice": "interest"}, {"id": "BR-INT-003", "title": "Setup jobs load the four KSDS masters and define the SYSTRAN GDG", "rule": "Before INTCALC, the setup jobs run in this order: DEFGDGB, ACCTFILE, XREFFILE, TCATBALF, DISCGRP. DEFGDGB defines the GDG base AWS.M2.CARDDEMO.SYSTRAN (LIMIT 5). Each of the other four jobs deletes, defines and REPROs a KSDS from its .PS file. The keys are: ACCTDATA 11 bytes at offset 0; CARDXREF 16 bytes at offset 0, plus a non-unique AIX on bytes 25-35 (account id) with a PATH; TCATBALF 17 bytes at offset 0; DISCGRP 16 bytes at offset 0. All setup steps end RC 0.", "category": "control-flow", "sources": [{"file": "app/jcl/DEFGDGB.jcl", "startLine": 48, "endLine": 53}, {"file": "app/jcl/ACCTFILE.jcl", "startLine": 36, "endLine": 62}, {"file": "app/jcl/XREFFILE.jcl", "startLine": 39, "endLine": 103}, {"file": "app/jcl/TCATBALF.jcl", "startLine": 36, "endLine": 62}, {"file": "app/jcl/DISCGRP.jcl", "startLine": 36, "endLine": 62}], "fields": ["ACCT-ID", "XREF-CARD-NUM", "XREF-ACCT-ID", "TRAN-CAT-KEY", "DIS-GROUP-KEY"], "given": "the i01 input .PS files", "when": "the setup chain runs", "then": "the KSDS files are loaded, and rc.json lists STEP05..STEP30 with RC 0 next to INTCALC STEP15", "fixtures": ["fixtures/interest/i01-baseline"], "finding": null, "slice": "interest"}, {"id": "BR-INT-004", "title": "File open order and access modes", "rule": "Files are opened in this order: TCATBALF (INPUT, sequential), XREFFILE (INPUT, random, read through the alternate key), DISCGRP (INPUT, random), ACCTFILE (I-O, random) and TRANSACT (OUTPUT, sequential). Each open moves 8 to APPL-RESULT first, then 0 if the status is '00' and 12 otherwise.", "category": "control-flow", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 27, "endLine": 56}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 182, "endLine": 186}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 234, "endLine": 323}], "fields": ["TCATBALF-STATUS", "XREFFILE-STATUS", "DISCGRP-STATUS", "ACCTFILE-STATUS", "TRANFILE-STATUS", "APPL-RESULT"], "given": "all five DDs are allocated", "when": "the program starts", "then": "all five files open with status '00' and processing begins", "fixtures": ["fixtures/interest/i01-baseline"], "finding": null, "slice": "interest"}, {"id": "BR-INT-005", "title": "Open failures abend with file-specific messages", "rule": "If an open returns a status other than '00', the program displays a message and then the file status (9910-DISPLAY-IO-STATUS) and abends (9999-ABEND-PROGRAM). The messages are: TCATBALF 'ERROR OPENING TRANSACTION CATEGORY BALANCE'; XREFFILE 'ERROR OPENING CROSS REF FILE' followed directly by the raw 2-byte status; DISCGRP 'ERROR OPENING DALY REJECTS FILE'; ACCTFILE 'ERROR OPENING ACCOUNT MASTER FILE'; TRANSACT 'ERROR OPENING TRANSACTION FILE'.", "category": "return-code", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 234, "endLine": 323}], "fields": ["TCATBALF-STATUS", "XREFFILE-STATUS", "DISCGRP-STATUS", "ACCTFILE-STATUS", "TRANFILE-STATUS"], "given": "the DISCGRP KSDS is missing (open status '35')", "when": "0200-DISCGRP-OPEN runs", "then": "SYSOUT shows 'ERROR OPENING DALY REJECTS FILE', 'FILE STATUS IS: NNNN0035', 'ABENDING PROGRAM', and the step abends U0999", "fixtures": [], "finding": "The DISCGRP open-failure message says 'DALY REJECTS FILE', a copy-paste error from another program. Operators and parity tests depend on this exact text, so it must be reproduced.", "slice": "interest"}, {"id": "BR-INT-006", "title": "TCATBALF processed in ascending key order", "rule": "TRAN-CAT-BAL records are read sequentially from the TCATBALF KSDS. They therefore arrive in ascending key order: TRANCAT-ACCT-ID (9(11)), then TRANCAT-TYPE-CD (X(02)), then TRANCAT-CD (9(04)). All records for one account are adjacent, which the account-break logic relies on.", "category": "control-flow", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 28, "endLine": 32}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 61, "endLine": 67}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 325, "endLine": 326}, {"file": "app/cpy/CVTRA01Y.cpy", "startLine": 4, "endLine": 10}, {"file": "app/jcl/TCATBALF.jcl", "startLine": 40, "endLine": 40}], "fields": ["TRANCAT-ACCT-ID", "TRANCAT-TYPE-CD", "TRANCAT-CD"], "given": "account 2007 has records 01/0001 (1000.00) and 01/0002 (500.00)", "when": "TCATBALF is read", "then": "01/0001 is processed first (TRAN-ID ...000001, 10.00), then 01/0002 (TRAN-ID ...000002, 7.50)", "fixtures": ["fixtures/interest/i05-multi-category"], "finding": null, "slice": "interest"}, {"id": "BR-INT-007", "title": "TCATBALF read status handling", "rule": "After each READ of TCATBALF: status '00' sets APPL-RESULT 0 and the record is processed. Status '10' sets APPL-RESULT 16 (APPL-EOF), which sets END-OF-FILE to 'Y'. Any other status displays 'ERROR READING TRANSACTION CATEGORY FILE' and the file status, then abends.", "category": "control-flow", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 325, "endLine": 348}], "fields": ["TCATBALF-STATUS", "APPL-RESULT", "END-OF-FILE"], "given": "TCATBALF has 2 records", "when": "the third READ returns status '10'", "then": "END-OF-FILE = 'Y'; nothing is displayed for the EOF read and the main loop ends", "fixtures": ["fixtures/interest/i01-baseline"], "finding": null, "slice": "interest"}, {"id": "BR-INT-008", "title": "Every TCATBALF record is echoed to SYSOUT", "rule": "For each record read (not on EOF), WS-RECORD-COUNT is incremented. The whole 50-byte TRAN-CAT-BAL-RECORD is DISPLAYed as raw text: the 17-byte key, the zoned TRAN-CAT-BAL with its overpunch sign character, and 22 trailing FILLER spaces. WS-RECORD-COUNT is never displayed or used anywhere else.", "category": "sysout", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 172, "endLine": 172}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 191, "endLine": 193}], "fields": ["TRAN-CAT-BAL-RECORD", "WS-RECORD-COUNT"], "given": "a TCATBALF record for account 2008, type 01, category 0001, balance -300.00", "when": "it is read", "then": "SYSOUT shows '000000020080100010000003000}' followed by 22 spaces", "fixtures": ["fixtures/interest/i06-negative-balance", "fixtures/interest/i01-baseline"], "finding": null, "slice": "interest"}, {"id": "BR-INT-009", "title": "Account break detection", "rule": "A new account starts when TRANCAT-ACCT-ID differs from WS-LAST-ACCT-NUM (X(11), initially SPACES). On a break: if WS-FIRST-TIME is not 'Y', the previous account is rewritten (1050-UPDATE-ACCOUNT); otherwise WS-FIRST-TIME is set to 'N' and nothing is rewritten. Then WS-TOTAL-INT is set to 0, the new account id is saved, and the account and XREF records are read.", "category": "control-flow", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 166, "endLine": 170}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 194, "endLine": 206}], "fields": ["TRANCAT-ACCT-ID", "WS-LAST-ACCT-NUM", "WS-FIRST-TIME", "WS-TOTAL-INT"], "given": "TCATBALF holds accounts 2001 then 2002", "when": "the 2002 record is read", "then": "account 2001 is rewritten with its 10.00 interest before 2002 is read; nothing is rewritten when the first record (2001) arrives", "fixtures": ["fixtures/interest/i01-baseline"], "finding": null, "slice": "interest"}, {"id": "BR-INT-010", "title": "Account master read at account break", "rule": "At each account break, ACCOUNT-FILE is read at random with key FD-ACCT-ID = TRANCAT-ACCT-ID, INTO ACCOUNT-RECORD. The record (ACCT-GROUP-ID, ACCT-CURR-BAL, ...) stays in working storage for all categories of that account, and is the record rewritten at the next break.", "category": "data-mapping", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 202, "endLine": 203}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 372, "endLine": 391}, {"file": "app/cpy/CVACT01Y.cpy", "startLine": 4, "endLine": 17}], "fields": ["FD-ACCT-ID", "ACCT-ID", "ACCT-GROUP-ID", "ACCT-CURR-BAL"], "given": "TCATBALF account 2002 and ACCTDATA account 2002 in group STANDARD", "when": "the break for 2002 happens", "then": "ACCOUNT-RECORD holds account 2002, and its rate lookup uses group 'STANDARD' (18.50 %)", "fixtures": ["fixtures/interest/i01-baseline"], "finding": null, "slice": "interest"}, {"id": "BR-INT-011", "title": "Missing account abends", "rule": "If the account read gets INVALID KEY (status '23'), the program displays 'ACCOUNT NOT FOUND: ' with the 11-digit FD-ACCT-ID, then 'ERROR READING ACCOUNT FILE' and the file status, and abends. Any other non-'00' status takes the same path without the NOT FOUND line. There is no skip-and-continue. Confirmed by an off-host scratch run of the legacy estate (not a golden fixture).", "category": "edge-case", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 372, "endLine": 391}], "fields": ["FD-ACCT-ID", "ACCTFILE-STATUS"], "given": "TCATBALF has a record for account 3001, which is not on ACCTDATA", "when": "the break for 3001 happens", "then": "SYSOUT shows 'ACCOUNT NOT FOUND: 00000003001', 'ERROR READING ACCOUNT FILE', 'FILE STATUS IS: NNNN0023', 'ABENDING PROGRAM'; STEP15 RC 12 off-host (U0999 on z/OS); no SYSTRAN records", "fixtures": [], "finding": null, "slice": "interest"}, {"id": "BR-INT-012", "title": "Card number taken from XREF by account id", "rule": "At each account break, XREF-FILE is read at random through the alternate key FD-XREF-ACCT-ID = TRANCAT-ACCT-ID, INTO CARD-XREF-RECORD. The AIX is defined NONUNIQUEKEY, so an account with several cards gets the first card returned for that account id. XREF-CARD-NUM becomes TRAN-CARD-NUM on every interest transaction for that account.", "category": "data-mapping", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 34, "endLine": 39}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 204, "endLine": 205}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 393, "endLine": 398}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 495, "endLine": 495}, {"file": "app/jcl/XREFFILE.jcl", "startLine": 72, "endLine": 80}, {"file": "app/cpy/CVACT03Y.cpy", "startLine": 4, "endLine": 8}], "fields": ["FD-XREF-ACCT-ID", "XREF-CARD-NUM", "TRAN-CARD-NUM"], "given": "CARDXREF maps card 4000000000002001 to account 2001", "when": "interest is written for account 2001", "then": "TRAN-CARD-NUM = '4000000000002001'", "fixtures": ["fixtures/interest/i01-baseline"], "finding": null, "slice": "interest"}, {"id": "BR-INT-013", "title": "Missing XREF abends with an 'ACCOUNT NOT FOUND' message", "rule": "If the XREF read by account id gets INVALID KEY, the program displays 'ACCOUNT NOT FOUND: ' with FD-XREF-ACCT-ID, then 'ERROR READING XREF FILE' and the file status, and abends. This happens even though the account record itself exists. Confirmed by an off-host scratch run of the legacy estate (not a golden fixture).", "category": "edge-case", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 393, "endLine": 413}], "fields": ["FD-XREF-ACCT-ID", "XREFFILE-STATUS"], "given": "account 2001 is on ACCTDATA and TCATBALF but has no CARDXREF row", "when": "the break for 2001 happens", "then": "SYSOUT shows 'ACCOUNT NOT FOUND: 00000002001', 'ERROR READING XREF FILE', 'FILE STATUS IS: NNNN0023', 'ABENDING PROGRAM'; STEP15 RC 12 off-host", "fixtures": [], "finding": "When the card cross-reference is missing, the program reports 'ACCOUNT NOT FOUND', which misleads operators because the account does exist. Reproduce the exact text.", "slice": "interest"}, {"id": "BR-INT-014", "title": "Disclosure-group key built from account group, type and category", "rule": "For every TCATBALF record, the DISCGRP key is built as FD-DIS-ACCT-GROUP-ID = ACCT-GROUP-ID (X(10)), FD-DIS-TRAN-TYPE-CD = TRANCAT-TYPE-CD and FD-DIS-TRAN-CAT-CD = TRANCAT-CD. The lookup is repeated for each category record, not once per account.", "category": "data-mapping", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 76, "endLine": 82}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 210, "endLine": 213}, {"file": "app/cpy/CVTRA02Y.cpy", "startLine": 4, "endLine": 10}], "fields": ["ACCT-GROUP-ID", "TRANCAT-TYPE-CD", "TRANCAT-CD", "FD-DIS-ACCT-GROUP-ID", "FD-DIS-TRAN-TYPE-CD", "FD-DIS-TRAN-CAT-CD"], "given": "account 2002 in group 'STANDARD  ' with a TCATBALF record of type 01, category 0001", "when": "the rate is looked up", "then": "the key read is 'STANDARD  010001', giving DIS-INT-RATE 18.50", "fixtures": ["fixtures/interest/i01-baseline"], "finding": null, "slice": "interest"}, {"id": "BR-INT-015", "title": "Interest rate differs by account group", "rule": "Two accounts with the same type and category but in different groups get different rates. GOLD 01/0001 is 12.00 % and STANDARD 01/0001 is 18.50 %.", "category": "calculation", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 210, "endLine": 215}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 415, "endLine": 416}], "fields": ["ACCT-GROUP-ID", "DIS-INT-RATE"], "given": "account 2001 GOLD with balance 1000.00 and account 2002 STANDARD with balance 2400.00, both 01/0001", "when": "interest is computed", "then": "TRAN-AMT is 10.00 for 2001 and 37.00 for 2002", "fixtures": ["fixtures/interest/i01-baseline"], "finding": null, "slice": "interest"}, {"id": "BR-INT-016", "title": "Interest rate differs by transaction category", "rule": "Each TCATBALF category record gets its own rate. For GOLD, type 01, category 0001 (purchases) is 12.00 % and category 0002 (cash advances) is 18.00 %.", "category": "calculation", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 210, "endLine": 215}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 415, "endLine": 416}], "fields": ["TRANCAT-CD", "DIS-INT-RATE"], "given": "account 2007 GOLD with 01/0001 = 1000.00 and 01/0002 = 500.00", "when": "interest is computed", "then": "two transactions are written: 10.00 and 7.50", "fixtures": ["fixtures/interest/i05-multi-category"], "finding": null, "slice": "interest"}, {"id": "BR-INT-017", "title": "DEFAULT disclosure-group fallback", "rule": "If the DISCGRP read gets INVALID KEY (status '23'), the program displays 'DISCLOSURE GROUP RECORD MISSING' and 'TRY WITH DEFAULT GROUP CODE'. Status '23' still counts as success (APPL-RESULT 0). FD-DIS-ACCT-GROUP-ID is set to 'DEFAULT' (same type and category) and the record is read again (1200-A-GET-DEFAULT-INT-RATE). The fallback happens for each category record that misses.", "category": "control-flow", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 415, "endLine": 440}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 443, "endLine": 446}], "fields": ["FD-DIS-ACCT-GROUP-ID", "DISCGRP-STATUS", "DIS-INT-RATE"], "given": "account 2006 in group PLATINUM (no DISCGRP rows) with 01/0001 = 1000.00; DEFAULT 01/0001 = 21.00 %", "when": "the rate is looked up", "then": "SYSOUT shows the two fallback lines after the record echo, and TRAN-AMT = 17.50", "fixtures": ["fixtures/interest/i04-default-group-fallback"], "finding": null, "slice": "interest"}, {"id": "BR-INT-018", "title": "Accounts in group DEFAULT match directly", "rule": "'DEFAULT' is an ordinary group key. An account whose ACCT-GROUP-ID is 'DEFAULT' finds its row on the first read: no fallback messages, and the DEFAULT rate applies.", "category": "control-flow", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 210, "endLine": 213}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 415, "endLine": 440}], "fields": ["ACCT-GROUP-ID", "DIS-INT-RATE"], "given": "account 2010 in group DEFAULT with 01/0001 = 777.77; DEFAULT 01/0001 = 21.00 %", "when": "the rate is looked up", "then": "no 'DISCLOSURE GROUP RECORD MISSING' line is printed and TRAN-AMT = 13.61", "fixtures": ["fixtures/interest/i07-nontie-rounding"], "finding": null, "slice": "interest"}, {"id": "BR-INT-019", "title": "Disclosure-group read failures abend", "rule": "A first DISCGRP read with a status other than '00' or '23' displays 'ERROR READING DISCLOSURE GROUP FILE' and abends. If the DEFAULT row is also missing (the second read does not return '00'), the program displays 'ERROR READING DEFAULT DISCLOSURE GROUP' and the file status, and abends. Confirmed by an off-host scratch run of the legacy estate (not a golden fixture).", "category": "return-code", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 422, "endLine": 435}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 443, "endLine": 460}], "fields": ["DISCGRP-STATUS"], "given": "account 2001 in group PLATINUM with a TCATBALF record 01/0003; there is no PLATINUM or DEFAULT 01/0003 row", "when": "the rate is looked up", "then": "SYSOUT shows 'DISCLOSURE GROUP RECORD MISSING', 'TRY WITH DEFAULT GROUP CODE', 'ERROR READING DEFAULT DISCLOSURE GROUP', 'FILE STATUS IS: NNNN0023', 'ABENDING PROGRAM'; STEP15 RC 12 off-host", "fixtures": [], "finding": null, "slice": "interest"}, {"id": "BR-INT-020", "title": "Zero-rate categories are skipped", "rule": "If DIS-INT-RATE = 0, the program skips 1300-COMPUTE-INTEREST and 1400-COMPUTE-FEES. No transaction is written, WS-TRANID-SUFFIX does not advance, and WS-TOTAL-INT does not change. The record is still echoed and still counts as part of its account.", "category": "validation", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 214, "endLine": 217}], "fields": ["DIS-INT-RATE", "WS-TRANID-SUFFIX"], "given": "account 2005 GOLD with 01/0001 = 1000.00 (12.00 %) and 02/0001 = -300.00 (0.00 %)", "when": "the run completes", "then": "exactly one SYSTRAN record (TRAN-ID 2022071800000001, 10.00) is written", "fixtures": ["fixtures/interest/i03-zero-rate-skipped"], "finding": null, "slice": "interest"}, {"id": "BR-INT-021", "title": "Monthly interest formula", "rule": "For each category with a non-zero rate: WS-MONTHLY-INT = (TRAN-CAT-BAL * DIS-INT-RATE) / 1200. This is the annual percentage rate divided by 12 months and by 100. TRAN-CAT-BAL is S9(09)V99, DIS-INT-RATE is S9(04)V99 and the result is S9(09)V99.", "category": "calculation", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 168, "endLine": 168}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 462, "endLine": 466}, {"file": "app/cpy/CVTRA01Y.cpy", "startLine": 9, "endLine": 9}, {"file": "app/cpy/CVTRA02Y.cpy", "startLine": 9, "endLine": 9}], "fields": ["TRAN-CAT-BAL", "DIS-INT-RATE", "WS-MONTHLY-INT"], "given": "TRAN-CAT-BAL = 2400.00 and DIS-INT-RATE = 18.50", "when": "1300-COMPUTE-INTEREST runs", "then": "WS-MONTHLY-INT = 37.00", "fixtures": ["fixtures/interest/i01-baseline"], "finding": null, "slice": "interest"}, {"id": "BR-INT-022", "title": "Interest is truncated, not rounded (half cent)", "rule": "The COMPUTE has no ROUNDED phrase, so digits beyond 2 decimals are dropped (truncated toward zero). An exact half cent is truncated down. A half-even reference (tools/parity/naive_ref.py) gives a different result only on such ties.", "category": "rounding", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 464, "endLine": 465}], "fields": ["WS-MONTHLY-INT", "TRAN-AMT"], "given": "account 2003 balance 1235.50 at 12.00 % (12.355) and account 2004 balance 1234.50 at 12.00 % (12.345)", "when": "interest is computed", "then": "TRAN-AMT = 12.35 for 2003 (half-even would give 12.36) and 12.34 for 2004", "fixtures": ["fixtures/interest/i02-tie-half-cent"], "finding": "Interest is truncated on every computation, so the bank under-charges up to 0.01 per category per month. This differs from both half-up and banker's rounding. Reproduce it with RoundingMode.DOWN.", "slice": "interest"}, {"id": "BR-INT-023", "title": "Non-tie sub-cent remainders are truncated", "rule": "Remainders that are not ties are also dropped. In these cases truncation agrees with half-even and half-up rounding.", "category": "rounding", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 464, "endLine": 465}], "fields": ["WS-MONTHLY-INT", "TRAN-AMT"], "given": "account 2009 1000.33 at 18.50 % (15.42175) and account 2010 777.77 at 21.00 % (13.610975)", "when": "interest is computed", "then": "TRAN-AMT = 15.42 and 13.61", "fixtures": ["fixtures/interest/i07-nontie-rounding"], "finding": null, "slice": "interest"}, {"id": "BR-INT-024", "title": "Negative balances produce negative interest", "rule": "A credit (negative) TRAN-CAT-BAL is not filtered out. It gives a negative WS-MONTHLY-INT, a negative interest transaction, and a lower total for the account. Truncation is toward zero, so a negative half cent -12.355 becomes -12.35 (not -12.36). The negative-tie case was confirmed by an off-host scratch run.", "category": "edge-case", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 214, "endLine": 215}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 464, "endLine": 467}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 490, "endLine": 490}], "fields": ["TRAN-CAT-BAL", "WS-MONTHLY-INT", "TRAN-AMT"], "given": "account 2008 GOLD with 01/0001 = -300.00 at 12.00 %", "when": "interest is computed", "then": "a SYSTRAN record with TRAN-AMT = -3.00 (zoned '0000000030}') is written", "fixtures": ["fixtures/interest/i06-negative-balance"], "finding": "The program charges negative interest (a credit to the customer) on credit balances, and nothing in the program prevents it. This must be reproduced.", "slice": "interest"}, {"id": "BR-INT-025", "title": "Zoned-decimal signs, not COMP-3", "rule": "All amounts in this slice (TRAN-CAT-BAL, DIS-INT-RATE, ACCT-CURR-BAL, ACCT-CURR-CYC-CREDIT/DEBIT, TRAN-AMT) are signed zoned DISPLAY fields with a trailing overpunch sign. No COMP-3 is used. The build uses -fsign=EBCDIC, so the last byte reads '{' = +0, 'A'..'I' = +1..+9, '}' = -0, 'J'..'R' = -1..-9. A Java port must encode and decode these signs byte for byte.", "category": "data-mapping", "sources": [{"file": "app/cpy/CVTRA01Y.cpy", "startLine": 9, "endLine": 9}, {"file": "app/cpy/CVTRA02Y.cpy", "startLine": 9, "endLine": 9}, {"file": "app/cpy/CVACT01Y.cpy", "startLine": 7, "endLine": 14}, {"file": "app/cpy/CVTRA05Y.cpy", "startLine": 10, "endLine": 10}, {"file": "tools/build.sh", "startLine": 16, "endLine": 16}], "fields": ["TRAN-CAT-BAL", "DIS-INT-RATE", "ACCT-CURR-BAL", "TRAN-AMT"], "given": "an account balance of 1247.85 and an interest amount of 15.42", "when": "the records are written", "then": "ACCT-CURR-BAL is stored as '00000012478E' and TRAN-AMT as '0000000154B'", "fixtures": ["fixtures/interest/i02-tie-half-cent", "fixtures/interest/i07-nontie-rounding", "fixtures/interest/i06-negative-balance"], "finding": null, "slice": "interest"}, {"id": "BR-INT-026", "title": "Account interest total is the sum of truncated category amounts", "rule": "WS-TOTAL-INT is set to 0 at each account break. Each category's already-truncated WS-MONTHLY-INT is added to it. The total is therefore a sum of truncated values, not one truncation of the combined amount.", "category": "calculation", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 169, "endLine": 169}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 200, "endLine": 200}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 467, "endLine": 467}], "fields": ["WS-TOTAL-INT", "WS-MONTHLY-INT"], "given": "account 2009 (15.42175 -> 15.42) followed by account 2010", "when": "the break for 2010 happens", "then": "WS-TOTAL-INT for 2009 is 15.42 and ACCT-CURR-BAL becomes 1000.33 + 15.42 = 1015.75", "fixtures": ["fixtures/interest/i07-nontie-rounding", "fixtures/interest/i05-multi-category"], "finding": null, "slice": "interest"}, {"id": "BR-INT-027", "title": "Arithmetic overflow drops high-order digits silently", "rule": "The COMPUTE into WS-MONTHLY-INT (S9(09)V99) and the ADD into ACCT-CURR-BAL (S9(10)V99) have no ON SIZE ERROR. A result too large for the field loses its leading digits without any message, and the return code stays 0. Confirmed by an off-host scratch run of the legacy estate (not a golden fixture).", "category": "edge-case", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 168, "endLine": 169}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 352, "endLine": 352}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 464, "endLine": 467}], "fields": ["WS-MONTHLY-INT", "WS-TOTAL-INT", "ACCT-CURR-BAL"], "given": "TRAN-CAT-BAL = 999999999.99, DIS-INT-RATE = 9999.99 (true result 8333324999.91), ACCT-CURR-BAL = 9999999999.99, and the account is not the last one", "when": "the run completes", "then": "TRAN-AMT = 333324999.91 and ACCT-CURR-BAL = 333324999.90 (high-order digits lost); STEP15 RC 0", "fixtures": [], "finding": "Overflow is silent and corrupts both the transaction amount and the balance. Realistic rates cannot reach it, but a converted program must truncate the same way and must not raise an error.", "slice": "interest"}, {"id": "BR-INT-028", "title": "1050-UPDATE-ACCOUNT adds total interest to ACCT-CURR-BAL", "rule": "When an account is closed off, WS-TOTAL-INT is added to ACCT-CURR-BAL in ACCOUNT-RECORD, and the record is rewritten to ACCTFILE.", "category": "state-change", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 350, "endLine": 356}], "fields": ["ACCT-CURR-BAL", "WS-TOTAL-INT"], "given": "account 2003 with ACCT-CURR-BAL 1235.50 and interest 12.35, followed by account 2004", "when": "the break for 2004 happens", "then": "account 2003 is rewritten with ACCT-CURR-BAL = 1247.85", "fixtures": ["fixtures/interest/i02-tie-half-cent", "fixtures/interest/i01-baseline"], "finding": null, "slice": "interest"}, {"id": "BR-INT-029", "title": "1050-UPDATE-ACCOUNT zeroes the cycle credit and debit", "rule": "The same rewrite sets ACCT-CURR-CYC-CREDIT and ACCT-CURR-CYC-DEBIT to 0, which closes the billing cycle.", "category": "state-change", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 353, "endLine": 354}], "fields": ["ACCT-CURR-CYC-CREDIT", "ACCT-CURR-CYC-DEBIT"], "given": "account 2001 with ACCT-CURR-CYC-CREDIT 1000.00, followed by account 2002", "when": "the break for 2002 happens", "then":
