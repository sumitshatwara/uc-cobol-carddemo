 "account 2001 is rewritten with ACCT-CURR-CYC-CREDIT = 0.00 and ACCT-CURR-CYC-DEBIT = 0.00", "fixtures": ["fixtures/interest/i01-baseline", "fixtures/interest/i07-nontie-rounding"], "finding": null, "slice": "interest"}, {"id": "BR-INT-030", "title": "Accounts with only zero-rate categories are still rewritten", "rule": "An account whose categories are all zero-rate still goes through 1050-UPDATE-ACCOUNT at the next break, as long as it is not the last account. 0.00 is added to the balance (no change), the cycle fields are zeroed, and the record is rewritten. No SYSTRAN record is written for it. Confirmed by an off-host scratch run of the legacy estate (not a golden fixture).", "category": "edge-case", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 194, "endLine": 200}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 214, "endLine": 217}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 350, "endLine": 356}], "fields": ["ACCT-CURR-BAL", "ACCT-CURR-CYC-CREDIT", "ACCT-CURR-CYC-DEBIT"], "given": "account 2001 with only 02/0001 = 1000.00 (0.00 %), cycle credit 1000.00 and cycle debit 300.00, followed by account 2002", "when": "the run completes", "then": "account 2001 keeps ACCT-CURR-BAL 1000.00 but has cycle credit and debit 0.00; the first SYSTRAN record belongs to account 2002", "fixtures": [], "finding": null, "slice": "interest"}, {"id": "BR-INT-031", "title": "Other account fields are preserved on rewrite; untouched accounts unchanged", "rule": "REWRITE FD-ACCTFILE-REC FROM ACCOUNT-RECORD writes back the full 300-byte record as read. ACCT-ID, ACCT-ACTIVE-STATUS, the credit limits, the open, expiry and reissue dates, ACCT-ADDR-ZIP, ACCT-GROUP-ID and FILLER are unchanged. Accounts with no TCATBALF records are never read or rewritten.", "category": "data-mapping", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 84, "endLine": 87}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 356, "endLine": 356}, {"file": "app/cpy/CVACT01Y.cpy", "startLine": 4, "endLine": 17}], "fields": ["ACCOUNT-RECORD", "ACCT-CREDIT-LIMIT", "ACCT-OPEN-DATE", "ACCT-GROUP-ID"], "given": "account 2009 with credit limit 5000.00, open date 2019-03-15, zip 10115, group STANDARD", "when": "it is rewritten with interest", "then": "only ACCT-CURR-BAL and the two cycle fields differ from the input record", "fixtures": ["fixtures/interest/i07-nontie-rounding"], "finding": null, "slice": "interest"}, {"id": "BR-INT-032", "title": "No eligibility checks on account status or dates", "rule": "The program never reads ACCT-ACTIVE-STATUS, ACCT-EXPIRAION-DATE or ACCT-REISSUE-DATE, and it does not validate dates (blank or zero dates pass through untouched). Inactive and expired accounts are charged interest like any other account. Confirmed by an off-host scratch run of the legacy estate (not a golden fixture).", "category": "validation", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 188, "endLine": 222}, {"file": "app/cpy/CVACT01Y.cpy", "startLine": 6, "endLine": 12}], "fields": ["ACCT-ACTIVE-STATUS", "ACCT-EXPIRAION-DATE"], "given": "account 2002 with ACCT-ACTIVE-STATUS 'N', balance 1000.00, 01/0001 = -300.00 at 12.00 %, followed by account 2003", "when": "the run completes", "then": "account 2002 gets a -3.00 transaction and is rewritten with ACCT-CURR-BAL 997.00 and cycle fields 0.00", "fixtures": [], "finding": "Inactive and expired accounts accrue interest, because no status or date check exists. This must be reproduced.", "slice": "interest"}, {"id": "BR-INT-033", "title": "Rewrite failure abends", "rule": "If REWRITE of ACCTFILE returns a status other than '00', the program displays 'ERROR RE-WRITING ACCOUNT FILE' and the file status, and abends.", "category": "return-code", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 356, "endLine": 369}], "fields": ["ACCTFILE-STATUS"], "given": "the ACCTFILE REWRITE returns status '22'", "when": "1050-UPDATE-ACCOUNT runs", "then": "SYSOUT shows 'ERROR RE-WRITING ACCOUNT FILE', 'FILE STATUS IS: NNNN0022', 'ABENDING PROGRAM'; the step abends", "fixtures": [], "finding": null, "slice": "interest"}, {"id": "BR-INT-034", "title": "End-of-file quirk: the last account on TCATBALF is never updated", "rule": "END-OF-FILE is set to 'Y' inside the loop body, on the READ that hits EOF. The inner IF then fails, and PERFORM UNTIL END-OF-FILE = 'Y' ends the loop before the outer ELSE branch (PERFORM 1050-UPDATE-ACCOUNT) can run. The highest account on TCATBALF therefore gets its interest transactions written, but its ACCT-CURR-BAL and cycle fields are never rewritten.", "category": "control-flow", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 188, "endLine": 222}], "fields": ["END-OF-FILE", "ACCT-CURR-BAL", "ACCT-CURR-CYC-CREDIT", "ACCT-CURR-CYC-DEBIT"], "given": "accounts 2001 and 2002 with interest 10.00 and 37.00", "when": "the run completes", "then": "2001 becomes 1010.00 with cycle fields 0.00; 2002 stays at 2400.00 with cycle credit 2400.00, even though its 37.00 transaction is on SYSTRAN", "fixtures": ["fixtures/interest/i01-baseline", "fixtures/interest/i02-tie-half-cent", "fixtures/interest/i07-nontie-rounding"], "finding": "Interest is posted to SYSTRAN for the last account but never added to its balance, which leaves the books out of balance. This is the documented legacy quirk (docs/BASELINE.md) and must be reproduced. A Java port must not add a final update.", "slice": "interest"}, {"id": "BR-INT-035", "title": "Single-account runs update no account at all", "rule": "Because of the end-of-file quirk, when TCATBALF holds one account only, ACCTDATA comes out byte-identical to the input, while SYSTRAN still holds the interest transactions. The fixture READMEs for i05 and i06 say the balance grows or shrinks. The golden expected/ files show it unchanged, and the golden files are authoritative.", "category": "edge-case", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 188, "endLine": 222}], "fields": ["ACCT-CURR-BAL"], "given": "account 2007 alone, with interest 10.00 + 7.50", "when": "the run completes", "then": "two SYSTRAN records are written, but ACCT-CURR-BAL stays 1500.00 and cycle credit stays 1500.00", "fixtures": ["fixtures/interest/i03-zero-rate-skipped", "fixtures/interest/i04-default-group-fallback", "fixtures/interest/i05-multi-category", "fixtures/interest/i06-negative-balance"], "finding": "The i05 and i06 READMEs say the account balance changes, but the golden files (and the legacy code) leave it unchanged. Reproduce the golden behaviour.", "slice": "interest"}, {"id": "BR-INT-036", "title": "TRAN-ID = PARM-DATE + run-wide 6-digit sequence", "rule": "Before each interest transaction, WS-TRANID-SUFFIX (9(06), initially 0) is incremented. TRAN-ID (X(16)) is then built with STRING from PARM-DATE (10 bytes) and WS-TRANID-SUFFIX (6 digits), DELIMITED BY SIZE. The suffix runs across the whole job: it is not reset per account and skips nothing, because zero-rate categories never increment it.", "category": "data-mapping", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 173, "endLine": 173}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 474, "endLine": 480}], "fields": ["TRAN-ID", "PARM-DATE", "WS-TRANID-SUFFIX"], "given": "PARM '2022071800' with interest for accounts 2001 and 2002", "when": "transactions are written", "then": "the TRAN-IDs are '2022071800000001' (2001) and '2022071800000002' (2002)", "fixtures": ["fixtures/interest/i01-baseline", "fixtures/interest/i03-zero-rate-skipped"], "finding": null, "slice": "interest"}, {"id": "BR-INT-037", "title": "Fixed SYSTRAN codes and blank merchant fields", "rule": "Every interest transaction has TRAN-TYPE-CD '01', TRAN-CAT-CD '05' (moved into 9(04), so stored as 0005), TRAN-SOURCE 'System' (space-padded to 10), TRAN-MERCHANT-ID 0, and TRAN-MERCHANT-NAME, CITY and ZIP all spaces.", "category": "data-mapping", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 482, "endLine": 484}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 491, "endLine": 494}, {"file": "app/cpy/CVTRA05Y.cpy", "startLine": 4, "endLine": 18}], "fields": ["TRAN-TYPE-CD", "TRAN-CAT-CD", "TRAN-SOURCE", "TRAN-MERCHANT-ID", "TRAN-MERCHANT-NAME", "TRAN-MERCHANT-CITY", "TRAN-MERCHANT-ZIP"], "given": "any interest transaction", "when": "it is written", "then": "bytes 17-32 are '010005System    ' and TRAN-MERCHANT-ID is '000000000'", "fixtures": ["fixtures/interest/i01-baseline"], "finding": null, "slice": "interest"}, {"id": "BR-INT-038", "title": "TRAN-DESC = 'Int. for a/c ' + 11-digit account id", "rule": "TRAN-DESC (X(100)) is built with STRING from the literal 'Int. for a/c ' (with its trailing space) and ACCT-ID (11 zero-padded digits from the current ACCOUNT-RECORD), and is space-padded.", "category": "data-mapping", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 485, "endLine": 489}], "fields": ["TRAN-DESC", "ACCT-ID"], "given": "account 2001", "when": "its interest transaction is written", "then": "TRAN-DESC = 'Int. for a/c 00000002001' followed by spaces", "fixtures": ["fixtures/interest/i01-baseline"], "finding": null, "slice": "interest"}, {"id": "BR-INT-039", "title": "TRAN-AMT is the per-category monthly interest", "rule": "TRAN-AMT is WS-MONTHLY-INT for that one category, not the account total. An account with several charged categories gets one transaction per category.", "category": "data-mapping", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 467, "endLine": 468}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 490, "endLine": 490}], "fields": ["TRAN-AMT", "WS-MONTHLY-INT"], "given": "account 2007 with category interests 10.00 and 7.50", "when": "transactions are written", "then": "there are two SYSTRAN records, with TRAN-AMT 10.00 and 7.50 (not one record of 17.50)", "fixtures": ["fixtures/interest/i05-multi-category"], "finding": null, "slice": "interest"}, {"id": "BR-INT-040", "title": "PROC-TS and ORIG-TS come from the frozen clock", "rule": "Z-GET-DB2-FORMAT-TIMESTAMP formats FUNCTION CURRENT-DATE as 'YYYY-MM-DD-HH.MM.SS.hh0000': the hundredths of a second followed by the literal '0000'. Both TRAN-ORIG-TS and TRAN-PROC-TS get the same value. Off-host the chain clock is frozen at 2022-07-05 10:00:00.00. The timestamp does not come from PARM-DATE.", "category": "data-mapping", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 140, "endLine": 165}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 496, "endLine": 498}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 613, "endLine": 626}, {"file": "tools/runjcl/chains.json", "startLine": 45, "endLine": 45}], "fields": ["TRAN-ORIG-TS", "TRAN-PROC-TS", "DB2-FORMAT-TS"], "given": "the frozen clock 2022-07-05 10:00:00.00", "when": "any interest transaction is written", "then": "TRAN-ORIG-TS = TRAN-PROC-TS = '2022-07-05-10.00.00.000000'", "fixtures": ["fixtures/interest/i01-baseline"], "finding": null, "slice": "interest"}, {"id": "BR-INT-041", "title": "SYSTRAN is a new 350-byte GDG generation", "rule": "TRANSACT is opened OUTPUT on AWS.M2.CARDDEMO.SYSTRAN(+1) (RECFM=F, LRECL=350, DISP=(NEW,CATLG,DELETE)). Each WRITE FD-TRANFILE-REC FROM TRAN-RECORD must return '00'; otherwise the program displays 'ERROR WRITING TRANSACTION RECORD' and the file status, and abends. Off-host the first generation is G0001V00.", "category": "state-change", "sources": [{"file": "app/jcl/INTCALC.jcl", "startLine": 37, "endLine": 41}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 89, "endLine": 92}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 500, "endLine": 515}], "fields": ["TRAN-RECORD", "TRANFILE-STATUS"], "given": "the i01 inputs", "when": "the run completes", "then": "AWS.M2.CARDDEMO.SYSTRAN.G0001V00 holds 2 records of 350 bytes (manifest lrecl 350)", "fixtures": ["fixtures/interest/i01-baseline"], "finding": null, "slice": "interest"}, {"id": "BR-INT-042", "title": "Fee computation is an empty stub", "rule": "1400-COMPUTE-FEES is performed for every charged category, but its body is only the comment '* To be implemented' followed by EXIT. No fee transactions are written and no balance changes come from fees.", "category": "edge-case", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 216, "endLine": 216}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 518, "endLine": 520}, {"file": "app/jcl/INTCALC.jcl", "startLine": 20, "endLine": 20}], "fields": [], "given": "any category with a non-zero rate", "when": "1400-COMPUTE-FEES runs", "then": "nothing happens: SYSTRAN holds only interest records (type 01, category 0005)", "fixtures": ["fixtures/interest/i05-multi-category"], "finding": "The JCL comment says the step will 'compute interest and fees', but fees are never charged. A converted program must not add fee logic.", "slice": "interest"}, {"id": "BR-INT-043", "title": "Empty TCATBALF produces an empty run with RC 0", "rule": "If the first TCATBALF READ returns EOF, no record is echoed, no account is read or rewritten, and SYSTRAN is created with 0 records. SYSOUT contains only the start and end banners, and the step ends RC 0. Confirmed by an off-host scratch run of the legacy estate (not a golden fixture).", "category": "edge-case", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 188, "endLine": 222}], "fields": ["END-OF-FILE"], "given": "an empty TCATBALF.PS and account 2001 on ACCTDATA", "when": "the run completes", "then": "SYSOUT is exactly the 2 banner lines; ACCTDATA is unchanged; SYSTRAN.G0001V00 has 0 records; rc.json STEP15 = 0", "fixtures": [], "finding": null, "slice": "interest"}, {"id": "BR-INT-044", "title": "Close order and close failures", "rule": "After the loop, files are closed in the same order they were opened (TCATBALF, XREF, DISCGRP, ACCTFILE, TRANSACT). A close status other than '00' displays one of: 'ERROR CLOSING TRANSACTION BALANCE FILE', 'ERROR CLOSING CROSS REF FILE', 'ERROR CLOSING DISCLOSURE GROUP FILE', 'ERROR CLOSING ACCOUNT FILE' or 'ERROR CLOSING TRANSACTION FILE', then the file status, and abends.", "category": "return-code", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 224, "endLine": 228}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 522, "endLine": 611}], "fields": ["TCATBALF-STATUS", "XREFFILE-STATUS", "DISCGRP-STATUS", "ACCTFILE-STATUS", "TRANFILE-STATUS"], "given": "a normal run", "when": "the closes run", "then": "all five closes return '00' and the end banner follows", "fixtures": ["fixtures/interest/i01-baseline"], "finding": null, "slice": "interest"}, {"id": "BR-INT-045", "title": "File-status display format (9910-DISPLAY-IO-STATUS)", "rule": "Every error path displays 'FILE STATUS IS: NNNN' followed by a 4-character IO-STATUS-04. If the status is numeric and does not start with '9', the value is '00' plus the 2-digit status (e.g. '0023'). If the status is not numeric or starts with '9', the value is the first status byte plus the binary value of the second byte as 3 digits.", "category": "sysout", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 122, "endLine": 131}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 635, "endLine": 648}], "fields": ["IO-STATUS", "IO-STATUS-04", "TWO-BYTES-BINARY"], "given": "an account read that fails with status '23'", "when": "9910-DISPLAY-IO-STATUS runs", "then": "SYSOUT shows 'FILE STATUS IS: NNNN0023' (the literal 'NNNN' is printed as-is)", "fixtures": [], "finding": null, "slice": "interest"}, {"id": "BR-INT-046", "title": "Abend path: U0999 via CEE3ABD; no rollback", "rule": "9999-ABEND-PROGRAM displays 'ABENDING PROGRAM' and calls CEE3ABD with ABCODE 999 and TIMING 0: user abend U0999 on z/OS. Off-host, the CEE3ABD stand-in also displays 'CEE3ABD: USER ABEND U+0000000999' and ends the step with RC 12. GnuCOBOL then adds 'implicit CLOSE' warnings, which are runtime noise and not program output. Accounts rewritten before the abend stay rewritten; nothing is rolled back. On z/OS, DISP=(NEW,CATLG,DELETE) deletes the new SYSTRAN generation on abend.", "category": "return-code", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 138, "endLine": 139}, {"file": "app/cbl/CBACT04C.cbl", "startLine": 628, "endLine": 632}, {"file": "tools/stubs/CEE3ABD.cbl", "startLine": 15, "endLine": 18}, {"file": "app/jcl/INTCALC.jcl", "startLine": 37, "endLine": 37}], "fields": ["ABCODE", "TIMING", "RETURN-CODE"], "given": "a missing account 3001 on TCATBALF", "when": "the account read fails", "then": "SYSOUT ends 'ABENDING PROGRAM', 'CEE3ABD: USER ABEND U+0000000999'; rc.json INTCALC maxrc = 12, STEP15 = 12; no END banner", "fixtures": [], "finding": null, "slice": "interest"}, {"id": "BR-INT-047", "title": "Normal completion returns RC 0", "rule": "On the normal path, RETURN-CODE is never set, so GOBACK ends STEP15 with RC 0. rc.json records INTCALC maxrc 0, with the setup step names STEP05..STEP30 merged in, all RC 0. No path in the program produces RC 4 or 8.", "category": "return-code", "sources": [{"file": "app/cbl/CBACT04C.cbl", "startLine": 232, "endLine": 232}], "fields": ["RETURN-CODE"], "given": "any fixture whose lookups all succeed (including the DEFAULT fallback)", "when": "the run completes", "then": "rc.json shows INTCALC maxrc 0 and STEP15 0", "fixtures": ["fixtures/interest/i01-baseline", "fixtures/interest/i02-tie-half-cent", "fixtures/interest/i03-zero-rate-skipped", "fixtures/interest/i04-default-group-fallback", "fixtures/interest/i05-multi-category", "fixtures/interest/i06-negative-balance", "fixtures/interest/i07-nontie-rounding"], "finding": null, "slice": "interest"}, {"id": "BR-TRT-001", "title": "INPFILE record layout", "rule": "Each INPFILE record is a fixed 53-byte card read INTO WS-INPUT-REC: column 1 is the action code (INPUT-REC-TYPE, X(1)), columns 2-3 the transaction type code (INPUT-REC-NUMBER, X(2)) and columns 4-53 the description (INPUT-REC-DESC, X(50)). The JCL header documents A=add, U=update, D=delete, *=comment.", "category": "data-mapping", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 39, "endLine": 46}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 71, "endLine": 77}, {"file": "app/app-transaction-type-db2/jcl/MNTTRDB2.jcl", "startLine": 8, "endLine": 18}, {"file": "tools/runjcl/chains.json", "startLine": 73, "endLine": 75}], "fields": ["INPUT-TYPE", "INPUT-TR-NUMBER", "INPUT-TR-DESC", "INPUT-REC-TYPE", "INPUT-REC-NUMBER", "INPUT-REC-DESC"], "given": "INPFILE card `A04Authorization`", "when": "COBTUPDT reads the card", "then": "INPUT-REC-TYPE='A', INPUT-REC-NUMBER='04', INPUT-REC-DESC='Authorization' followed by 37 spaces", "fixtures": ["fixtures/trantype-update/t01-add"], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-002", "title": "Short cards are space-padded to LRECL 53", "rule": "Harness behaviour: the fixture loader writes INPFILE as fixed 53-byte records, right-padding shorter lines with spaces and truncating longer ones, which matches a RECFM=FB LRECL=53 dataset on z/OS. A card shorter than 53 bytes therefore yields a space-filled description, and a one-character type code leaves the second digit blank.", "category": "data-mapping", "sources": [{"file": "tools/parity/record.py", "startLine": 46, "endLine": 51}, {"file": "tools/runjcl/chains.json", "startLine": 73, "endLine": 75}], "fields": ["INPUT-REC-DESC", "INPUT-REC-NUMBER"], "given": "INPFILE line `D03` (3 bytes)", "when": "the case is materialised and COBTUPDT reads it", "then": "the record is `D03` + 50 spaces and SYSOUT shows `PROCESSING   D03` padded to 66 characters", "fixtures": ["fixtures/trantype-update/t03-delete"], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-003", "title": "Sequential read loop until end of file", "rule": "COBTUPDT performs a priming read, then repeats treat-record / read-next until the AT END condition sets LASTREC='Y'. Records are processed strictly in file order, one at a time; there is no sorting, de-duplication or look-ahead.", "category": "control-flow", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 91, "endLine": 96}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 100, "endLine": 103}], "fields": ["LASTREC", "WS-INPUT-REC"], "given": "INPFILE `A07Chargeback`, `U01Purchase - card present`, `*  skip`, `D02`", "when": "MNTTRDB2 runs", "then": "the four records are processed in that order: insert 07, update 01, comment, delete 02", "fixtures": ["fixtures/trantype-update/t07-mixed-batch"], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-004", "title": "PROCESSING echo for every record", "rule": "Every record read (including comments and invalid actions) is echoed to SYSOUT as the literal `PROCESSING   ` (PROCESSING + 3 spaces) followed by the full 53-byte WS-INPUT-REC, trailing spaces included. Nothing is echoed for the end-of-file read.", "category": "sysout", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 104, "endLine": 106}], "fields": ["WS-INPUT-REC"], "given": "INPFILE `*  Nightly maintenance batch`", "when": "the record is read", "then": "SYSOUT line `PROCESSING   *  Nightly maintenance batch` padded with spaces to 66 characters", "fixtures": ["fixtures/trantype-update/t04-comments"], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-005", "title": "Open status message, no stop on open failure", "rule": "After OPEN INPUT the program displays `OPEN FILE OK` when WS-INF-STATUS='00', otherwise `OPEN FILE NOT OK`. In both cases processing continues into the read loop; no return code is set and the run is not stopped.", "category": "sysout", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 82, "endLine": 89}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 31, "endLine": 34}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 67, "endLine": 69}], "fields": ["WS-INF-STATUS", "WS-INF-STAT1", "WS-INF-STAT2"], "given": "a valid INPFILE dataset", "when": "COBTUPDT opens INPFILE", "then": "SYSOUT line 2 is `OPEN FILE OK`", "fixtures": ["fixtures/trantype-update/t01-add"], "finding": "On an open failure the program only prints `OPEN FILE NOT OK` and carries on reading an unopened file with no RC and no stop. Looks wrong; it must be reproduced (source-only path).", "slice": "trantype"}, {"id": "BR-TRT-006", "title": "Action dispatch on column 1 (case-sensitive)", "rule": "The action code is evaluated exactly: 'A' -> insert, 'U' -> update, 'D' -> delete, '*' -> comment, anything else (including lower-case letters and space) -> invalid. Each valid action first displays `ADDING RECORD`, `UPDATING RECORD`, `DELETING RECORD` or `IGNORING COMMENTED LINE`. Confirmed by an off-host scratch run of the legacy estate (not a golden case).", "category": "validation", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 109, "endLine": 129}], "fields": ["INPUT-REC-TYPE"], "given": "INPFILE `a08lower`", "when": "COBTUPDT evaluates the action code", "then": "lower-case 'a' is not an add: SYSOUT shows `ERROR: TYPE NOT VALID` and no row 08 is inserted", "fixtures": [], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-007", "title": "Comment cards are skipped", "rule": "A card with '*' in column 1 displays `IGNORING COMMENTED LINE` and performs no SQL; it does not change the return code.", "category": "control-flow", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 120, "endLine": 121}], "fields": ["INPUT-REC-TYPE"], "given": "INPFILE `*  Nightly maintenance batch`, `A06Fee`, `*  end`", "when": "MNTTRDB2 runs", "then": "both comments print `IGNORING COMMENTED LINE`, only type 06 is inserted, step RC 0", "fixtures": ["fixtures/trantype-update/t04-comments"], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-008", "title": "Invalid action code reports an error and sets RC 4", "rule": "Any action code other than A/U/D/* builds `ERROR: TYPE NOT VALID` into WS-RETURN-MSG, performs 9999-ABEND which DISPLAYs the 80-byte WS-RETURN-MSG and moves 4 to RETURN-CODE, then continues with the next record. Confirmed by an off-host scratch run of the legacy estate (not a golden case).", "category": "validation", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 122, "endLine": 128}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 230, "endLine": 233}], "fields": ["INPUT-REC-TYPE", "WS-RETURN-MSG", "RETURN-CODE"], "given": "seeded table 01/02/03 and INPFILE `X01bad`, `*  c`", "when": "MNTTRDB2 runs", "then": "SYSOUT shows `ERROR: TYPE NOT VALID` padded to 80 characters, then the comment is ignored; step RC 4; table unchanged", "fixtures": [], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-009", "title": "Blank card is an invalid action", "rule": "A blank (all-space) card is not treated as a comment or skipped: it is echoed as `PROCESSING` plus spaces and rejected with `ERROR: TYPE NOT VALID` (RC 4 unless a later SQL statement resets it, see BR-TRT-024). Confirmed by an off-host scratch run of the legacy estate (not a golden case).", "category": "edge-case", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 104, "endLine": 106}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 122, "endLine": 128}], "fields": ["INPUT-REC-TYPE"], "given": "INPFILE containing one empty line", "when": "COBTUPDT reads it", "then": "SYSOUT shows `PROCESSING` + 56 spaces, then `ERROR: TYPE NOT VALID`", "fixtures": [], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-010", "title": "Add inserts a TRANSACTION_TYPE row", "rule": "Action 'A' executes INSERT INTO CARDDEMO.TRANSACTION_TYPE (TR_TYPE, TR_DESCRIPTION) VALUES (:INPUT-REC-NUMBER, :INPUT-REC-DESC). On SQLCODE 0 it displays `RECORD INSERTED SUCCESSFULLY`.", "category": "state-change", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 111, "endLine": 113}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 137, "endLine": 153}, {"file": "db/postgres/01-transaction-type.sql", "startLine": 6, "endLine": 9}], "fields": ["INPUT-REC-NUMBER", "INPUT-REC-DESC", "TR_TYPE", "TR_DESCRIPTION"], "given": "seeded table 01/02/03 and INPFILE `A04Authorization`, `A05Refund`", "when": "MNTTRDB2 runs", "then": "SYSOUT shows `ADDING RECORD` / `RECORD INSERTED SUCCESSFULLY` twice; rows 04 and 05 exist; step RC 0", "fixtures": ["fixtures/trantype-update/t01-add"], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-011", "title": "Descriptions are stored space-padded to 50 bytes", "rule": "COBTUPDT binds the fixed-length PIC X(50) INPUT-REC-DESC, not the DCLGEN VARCHAR structure (DCL-TR-DESCRIPTION-LEN/-TEXT is included but never used), and Open COBOL ESQL sends the full 50-byte host variable. Every row written by COBTUPDT therefore holds a 50-character TR_DESCRIPTION with trailing spaces, whereas seed rows and rows set by dynamic SQL literals are unpadded.", "category": "data-mapping", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 76, "endLine": 77}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 145, "endLine": 146}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 173, "endLine": 173}, {"file": "app/app-transaction-type-db2/dcl/DCLTRTYP.dcl", "startLine": 35, "endLine": 46}, {"file": "db/postgres/01-transaction-type.sql", "startLine": 8, "endLine": 8}], "fields": ["INPUT-REC-DESC", "DCL-TR-DESCRIPTION-LEN", "DCL-TR-DESCRIPTION-TEXT", "TR_DESCRIPTION"], "given": "INPFILE `U02Payment - bank transfer`", "when": "the update is applied", "then": "TR_DESCRIPTION for 02 is `Payment - bank transfer` followed by 27 spaces (50 characters), while 01 stays `Purchase` unpadded", "fixtures": ["fixtures/trantype-update/t02-update", "fixtures/trantype-update/t01-add"], "finding": "The VARCHAR column receives trailing blanks and the DCLGEN length field is ignored, so the table mixes padded and unpadded descriptions. Must be reproduced (golden DB snapshots contain the padding).", "slice": "trantype"}, {"id": "BR-TRT-012", "title": "No validation of type code or description", "rule": "COBTUPDT does not check that the type code is numeric (the JCL comment says it should be) or non-blank, nor that the description is non-blank. A blank type code inserts TR_TYPE '  '; a non-numeric code such as '9X' is inserted as is; a card with no description inserts 50 spaces (NOT NULL is still satisfied). Confirmed by an off-host scratch run of the legacy estate (not a golden case).", "category": "validation", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 109, "endLine": 113}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 137, "endLine": 148}, {"file": "app/app-transaction-type-db2/jcl/MNTTRDB2.jcl", "startLine": 16, "endLine": 16}], "fields": ["INPUT-REC-NUMBER", "INPUT-REC-DESC", "TR_TYPE"], "given": "INPFILE `A  NoNumber` and `A9Xshort`", "when": "MNTTRDB2 runs", "then": "rows TR_TYPE='  ' (description `NoNumber` padded) and TR_TYPE='9X' (description `short` padded) are inserted, `RECORD INSERTED SUCCESSFULLY` twice, step RC 0", "fixtures": [], "finding": "Type codes documented as numeric are not validated; blank and alphanumeric keys are accepted. Must be reproduced.", "slice": "trantype"}, {"id": "BR-TRT-013", "title": "Duplicate add fails with negative SQLCODE (-403 under ocesql)", "rule": "A primary-key violation on INSERT gives SQLCODE < 0. Through Open COBOL ESQL/PostgreSQL the value is -403 (Db2 would return -803). COBTUPDT reports it via 9999-ABEND and sets RC 4; the row is not inserted.", "category": "return-code", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 151, "endLine": 163}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 230, "endLine": 233}, {"file": "db/postgres/01-transaction-type.sql", "startLine": 9, "endLine": 9}], "fields": ["TR_TYPE", "SQLCODE", "WS-VAR-SQLCODE", "RETURN-CODE"], "given": "seeded table 01/02/03 and INPFILE `A01Purchase`", "when": "MNTTRDB2 runs", "then": "SYSOUT `Error accessing: TRANSACTION_TYPE table. SQLCODE: -403`; step RC 4; table unchanged", "fixtures": ["fixtures/trantype-update/t06-duplicate-add"], "finding": "The SQLCODE printed is the ocesql value -403, not Db2's -803. The golden SYSOUT records -403 and must be reproduced.", "slice": "trantype"}, {"id": "BR-TRT-014", "title": "SQL error message format", "rule": "On SQLCODE < 0 the program STRINGs `Error accessing:` + ` TRANSACTION_TYPE table. SQLCODE:` + WS-VAR-SQLCODE (edited PIC ----9, 5 characters, so -403 becomes ` -403`) into the 80-byte WS-RETURN-MSG, and 9999-ABEND DISPLAYs the whole 80-byte field (trailing spaces included).", "category": "sysout", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 61, "endLine": 65}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 155, "endLine": 161}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 186, "endLine": 192}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 217, "endLine": 223}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 230, "endLine": 231}], "fields": ["WS-RETURN-MSG", "WS-VAR-SQLCODE", "SQLCODE"], "given": "SQLCODE -403 on an insert", "when": "the error message is built and displayed", "then": "SYSOUT line is `Error accessing: TRANSACTION_TYPE table. SQLCODE: -403` padded with spaces to 80 characters", "fixtures": ["fixtures/trantype-update/t06-duplicate-add"], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-015", "title": "WS-RETURN-MSG is never cleared between messages", "rule": "STRING writes from position 1 without clearing WS-RETURN-MSG, so a shorter message overwrites only the start of the previous one. After a 54-character SQL error, an invalid action shows `ERROR: TYPE NOT VALID` followed by the leftover tail of the earlier text. Confirmed by an off-host scratch run of the legacy estate (not a golden case).", "category": "edge-case", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 60, "endLine": 62}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 123, "endLine": 128}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 155, "endLine": 161}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 230, "endLine": 231}], "fields": ["WS-RETURN-MSG"], "given": "seeded table 01/02/03 and INPFILE `A01Dup`, `X01bad`", "when": "MNTTRDB2 runs", "then": "SYSOUT shows `Error accessing: TRANSACTION_TYPE table. SQLCODE: -403` then `ERROR: TYPE NOT VALIDSACTION_TYPE table. SQLCODE: -403`", "fixtures": [], "finding": "Error text is corrupted by residue from the previous message. Looks wrong; operators see it in SYSOUT, so it must be reproduced byte for byte.", "slice": "trantype"}, {"id": "BR-TRT-016", "title": "Positive SQLCODE on insert is silently ignored", "rule": "The insert EVALUATE only handles SQLCODE = 0 and SQLCODE < 0. A positive SQLCODE (a warning) prints no success or error line and leaves RETURN-CODE unchanged.", "category": "edge-case", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 151, "endLine": 163}], "fields": ["SQLCODE"], "given": "an INSERT that returns a positive warning SQLCODE", "when": "10031-INSERT-DB evaluates it", "then": "only `ADDING RECORD` is shown for the card and RC is unchanged", "fixtures": [], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-017", "title": "Update replaces the description of an existing type", "rule": "Action 'U' executes UPDATE CARDDEMO.TRANSACTION_TYPE SET TR_DESCRIPTION = :INPUT-REC-DESC WHERE TR_TYPE = :INPUT-REC-NUMBER and on SQLCODE 0 displays `RECORD UPDATED SUCCESSFULLY`. TR_TYPE itself is never changed.", "category": "state-change", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 114, "endLine": 116}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 171, "endLine": 179}], "fields": ["INPUT-REC-NUMBER", "INPUT-REC-DESC", "TR_TYPE", "TR_DESCRIPTION"], "given": "seeded 02='Payment' and INPFILE `U02Payment - bank transfer`", "when": "MNTTRDB2 runs", "then": "`UPDATING RECORD` / `RECORD UPDATED SUCCESSFULLY`; 02 now holds `Payment - bank transfer` padded to 50; RC 0", "fixtures": ["fixtures/trantype-update/t02-update"], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-018", "title": "Update of a missing type reports success under ocesql", "rule": "The update has a +100 branch (`No records found.` + RC 4), but through Open COBOL ESQL/PostgreSQL a searched UPDATE that matches no row returns SQLCODE 0, so `RECORD UPDATED SUCCESSFULLY` prints, nothing changes and RC stays 0. On Db2 the same card would give +100, `No records found.` and RC 4. Confirmed by an off-host scratch run of the legacy estate (not a golden case).", "category": "edge-case", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 176, "endLine": 184}], "fields": ["SQLCODE", "WS-RETURN-MSG", "RETURN-CODE"], "given": "seeded table 01/02/03 and INPFILE `U09Nothing`", "when": "MNTTRDB2 runs", "then": "SYSOUT `UPDATING RECORD` / `RECORD UPDATED SUCCESSFULLY`; table unchanged; step RC 0", "fixtures": [], "finding": "A no-op update is reported as successful and the +100 branch can never fire under the harness. Must be reproduced as the PostgreSQL-recorded behaviour.", "slice": "trantype"}, {"id": "BR-TRT-019", "title": "Update SQL error reports and sets RC 4", "rule": "A negative SQLCODE on UPDATE prints the standard `Error accessing: TRANSACTION_TYPE table. SQLCODE:` message and sets RETURN-CODE 4; the row is not changed.", "category": "return-code", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 185, "endLine": 193}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 230, "endLine": 233}], "fields": ["SQLCODE", "WS-VAR-SQLCODE", "RETURN-CODE"], "given": "a transaction already aborted by a failed dynamic statement and INPFILE `U01Purchase - updated`", "when": "COBTUPDT runs the update", "then": "SYSOUT `Error accessing: TRANSACTION_TYPE table. SQLCODE: -400`; 01 stays `Purchase`; step RC 4", "fixtures": ["fixtures/trantype-dynamic/d03-bad-statement"], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-020", "title": "Delete removes a type by key", "rule": "Action 'D' executes DELETE FROM CARDDEMO.TRANSACTION_TYPE WHERE TR_TYPE = :INPUT-REC-NUMBER (the description columns are ignored) and on SQLCODE 0 displays `RECORD DELETED SUCCESSFULLY`.", "category": "state-change", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 117, "endLine": 119}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 201, "endLine": 209}], "fields": ["INPUT-REC-NUMBER", "TR_TYPE"], "given": "seeded table 01/02/03 and INPFILE `D03`", "when": "MNTTRDB2 runs", "then": "`DELETING RECORD` / `RECORD DELETED SUCCESSFULLY`; rows 01 and 02 remain; RC 0", "fixtures": ["fixtures/trantype-update/t03-delete"], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-021", "title": "Delete of a missing type reports success", "rule": "Deleting a type that does not exist prints `RECORD DELETED SUCCESSFULLY` with RC 0 and leaves the table unchanged. Under Open COBOL ESQL/PostgreSQL a 0-row searched DELETE returns SQLCODE 0, so the coded +100 branch (`No records found.` + RC 4) is never reached; on Db2 the +100 branch would fire.", "category": "edge-case", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 205, "endLine": 214}], "fields": ["SQLCODE", "TR_TYPE"], "given": "seeded table 01/02/03 and INPFILE `D09`", "when": "MNTTRDB2 runs", "then": "SYSOUT `DELETING RECORD` / `RECORD DELETED SUCCESSFULLY`; table unchanged; step RC 0", "fixtures": ["fixtures/trantype-update/t05-delete-missing"], "finding": "Success is reported for a delete that removed nothing. The fixture README attributes this to COBTUPDT testing only SQLCODE < 0, but the source does test +100; the real cause is that ocesql returns 0. Must be reproduced.", "slice": "trantype"}, {"id": "BR-TRT-022", "title": "Delete SQL error reports and sets RC 4", "rule": "A negative SQLCODE on DELETE (for example a foreign-key restriction from TRANSACTION_TYPE_CATEGOR, or -400 in an aborted transaction) prints the standard SQL error message and sets RETURN-CODE 4.", "category": "return-code", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 216, "endLine": 224}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 230, "endLine": 233}, {"file": "db/postgres/01-transaction-type.sql", "startLine": 16, "endLine": 17}], "fields": ["SQLCODE", "WS-VAR-SQLCODE", "RETURN-CODE"], "given": "a type 01 that is referenced by a transaction_type_categor row and INPFILE `D01`", "when": "COBTUPDT runs the delete", "then": "SYSOUT `Error accessing: TRANSACTION_TYPE table. SQLCODE:` with the negative code; row 01 kept (and see BR-TRT-029 for the whole-run rollback); RC 4", "fixtures": [], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-023", "title": "Errors never stop the batch", "rule": "Despite its name, 9999-ABEND only displays the message and moves 4 to RETURN-CODE; control returns to the read loop and the remaining cards are processed. Confirmed by an off-host scratch run of the legacy estate (not a golden case).", "category": "control-flow", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 230, "endLine": 233}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 93, "endLine": 96}], "fields": ["RETURN-CODE", "LASTREC"], "given": "INPFILE `A04Authorization`, `A01Dup`, `X01bad`, `A05Refund`", "when": "MNTTRDB2 runs", "then": "all four cards are echoed and processed after the -403 on `A01Dup`; there is no abend", "fixtures": [], "finding": "The paragraph named ABEND does not abend. Must be reproduced (continue after error).", "slice": "trantype"}, {"id": "BR-TRT-024", "title": "RETURN-CODE 4 is reset by any later SQL statement", "rule": "RC 4 is not sticky. Each EXEC SQL is precompiled by ocesql into CALLs to the ocesql runtime, and each CALL overwrites the RETURN-CODE special register (normally with 0). The step RC therefore reflects only an error raised after the last executed SQL statement: an invalid card followed by a successful SQL card ends with RC 0; an invalid card followed only by comments ends with RC 4. Confirmed by an off-host scratch run of the legacy estate (not a golden case).", "category": "return-code", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 232, "endLine": 232}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 137, "endLine": 148}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 201, "endLine": 204}], "fields": ["RETURN-CODE"], "given": "seeded table 01/02/03 and INPFILE `X01bad`, `D99`", "when": "MNTTRDB2 runs", "then": "SYSOUT shows `ERROR: TYPE NOT VALID` then `RECORD DELETED SUCCESSFULLY`; step RC is 0, not 4", "fixtures": [], "finding": "Earlier errors are lost from the step RC whenever a later SQL statement runs. Looks wrong; the RC must be reproduced as observed under the harness.", "slice": "trantype"}, {"id": "BR-TRT-025", "title": "End of input closes the file and STOP RUN", "rule": "At end of file COBTUPDT closes INPFILE and executes STOP RUN (the EXIT before it is a no-op). An empty INPFILE gives only `OPEN FILE OK` and RC 0.", "category": "control-flow", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 97, "endLine": 99}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 234, "endLine": 236}], "fields": ["LASTREC"], "given": "an empty INPFILE", "when": "COBTUPDT runs", "then": "SYSOUT from COBTUPDT is just `OPEN FILE OK`; no SQL; RC 0", "fixtures": ["fixtures/trantype-dynamic/d02-delete-statement"], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-026", "title": "MNTTRDB2 step and RC", "rule": "MNTTRDB2 has one step, STEP1 (EXEC PGM=IKJEFT01) with SYSTSIN `DSN SYSTEM(DAZ1)` / `RUN PROGRAM(COBTUPDT) PLAN(CARDDEMO)` and INPFILE DD. Harness behaviour: the runner maps the RUN subcommand to `cobcrun DSNRUN COBTUPDT`; the STEP1 RC (and job maxrc) is the RETURN-CODE in effect at COBTUPDT's STOP RUN.", "category": "return-code", "sources": [{"file": "app/app-transaction-type-db2/jcl/MNTTRDB2.jcl", "startLine": 21, "endLine": 30}, {"file": "tools/runjcl/runjcl.py", "startLine": 704, "endLine": 715}], "fields": ["RETURN-CODE"], "given": "INPFILE `A01Purchase` against the seeded table", "when": "MNTTRDB2 runs", "then": "rc.json is `{\"MNTTRDB2\": {\"maxrc\": 4, \"steps\": {\"STEP1\": 4}}}`", "fixtures": ["fixtures/trantype-update/t06-duplicate-add", "fixtures/trantype-update/t01-add"], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-027", "title": "DSN attach banner and connect failure (harness)", "rule": "Harness behaviour emulating IKJEFT01/DSN: DSNRUN reads the program name and optional PARMS from its command line, connects to PostgreSQL using OCDB_NAME/OCDB_USER/OCDB_PASS and displays `DSNRUN: DSN ATTACHED, RUNNING <program>` before calling it. If the connect fails it displays `DSNRUN: DATABASE CONNECT FAILED <sqlcode>` and stops with RC 12 without running the program.", "category": "sysout", "sources": [{"file": "tools/stubs/DSNRUN.cbl", "startLine": 31, "endLine": 48}], "fields": ["WS-PGM-NAME", "WS-DB-NAME", "WS-DB-USER", "WS-DB-PASS", "RETURN-CODE"], "given": "a reachable database", "when": "MNTTRDB2 STEP1 starts", "then": "SYSOUT line 1 is `DSNRUN: DSN ATTACHED, RUNNING COBTUPDT`", "fixtures": ["fixtures/trantype-update/t01-add"], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-028", "title": "Commit at end of task (harness)", "rule": "Harness behaviour: the application programs never COMMIT. DSNRUN installs DSNEXIT with CBL_EXIT_PROC, so when the program ends (STOP RUN) DSNEXIT issues COMMIT, displays `DSNRUN: COMMIT AT END OF TASK` (or `DSNRUN: COMMIT FAILED <sqlcode>`) and disconnects. This mirrors the implicit commit of the TSO DSN command at normal end of task. All changes of the run are one unit of work.", "category": "state-change", "sources": [{"file": "tools/stubs/DSNRUN.cbl", "startLine": 49, "endLine": 52}, {"file": "tools/stubs/DSNEXIT.cbl", "startLine": 13, "endLine": 21}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 97, "endLine": 99}], "fields": ["SQLCODE"], "given": "INPFILE `A04Authorization`, `A05Refund`", "when": "COBTUPDT reaches STOP RUN", "then": "the last SYSOUT line is `DSNRUN: COMMIT AT END OF TASK` and rows 04/05 are persisted", "fixtures": ["fixtures/trantype-update/t01-add"], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-029", "title": "Failed statement aborts the whole PostgreSQL unit of work", "rule": "Under PostgreSQL any failed SQL statement puts the transaction into the aborted state: every later statement in the same run gets SQLCODE -400, and the end-of-task COMMIT silently becomes a rollback, so earlier successful inserts/updates/deletes of the run are lost too, although SYSOUT still says `RECORD INSERTED SUCCESSFULLY` and `DSNRUN: COMMIT AT END OF TASK`. Db2 would roll back only the failing statement and commit the rest. The rollback of earlier successes was confirmed by an off-host scratch run.", "category": "state-change", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 149, "endLine": 163}, {"file": "tools/stubs/DSNEXIT.cbl", "startLine": 14, "endLine": 19}, {"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 95, "endLine": 101}], "fields": ["SQLCODE", "TR_TYPE", "TR_DESCRIPTION"], "given": "seeded table 01/02/03 and INPFILE `A04Authorization`, `A01Dup`, `X01bad`, `A05Refund`", "when": "MNTTRDB2 runs", "then": "04 prints `RECORD INSERTED SUCCESSFULLY`, 01 fails with -403, 05 fails with -400, SYSOUT ends `DSNRUN: COMMIT AT END OF TASK`, but the table still holds only 01/02/03; step RC 4", "fixtures": ["fixtures/trantype-dynamic/d03-bad-statement"], "finding": "A single error discards the whole run while SYSOUT reports success and commit. This is a PostgreSQL vs Db2 semantic gap recorded in the golden files; it must be reproduced (or changed only by an explicit migration decision).", "slice": "trantype"}, {"id": "BR-TRT-030", "title": "MNTTRDYN step, DDs and PARMS", "rule": "MNTTRDYN STEP1 runs IKJEFT01 with `DSN SYSTEM(DAZ1)` / `RUN PROGRAM(CBTRNDYN) PLAN(CARDDEMO) PARMS('COBTUPDT')` / `END`, and allocates DYNSQL (statement cards) and INPFILE (COBTUPDT update cards). Harness behaviour: the runner passes the PARMS text as a second argument and DSNRUN builds the z/OS halfword-length parameter area (PARM-LENGTH 8, PARM-VALUE 'COBTUPDT') passed USING to CBTRNDYN.", "category": "control-flow", "sources": [{"file": "app/app-transaction-type-db2/jcl/MNTTRDYN.jcl", "startLine": 23, "endLine": 34}, {"file": "tools/stubs/DSNRUN.cbl", "startLine": 26, "endLine": 35}, {"file": "tools/stubs/DSNRUN.cbl", "startLine": 51, "endLine": 51}, {"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 52, "endLine": 56}, {"file": "tools/runjcl/runjcl.py", "startLine": 707, "endLine": 711}], "fields": ["PARM-LENGTH", "PARM-VALUE", "WS-PARM-LENGTH", "WS-PARM-VALUE"], "given": "the MNTTRDYN JCL", "when": "STEP1 runs", "then": "SYSOUT line 1 is `DSNRUN: DSN ATTACHED, RUNNING CBTRNDYN` and CBTRNDYN receives PARM-LENGTH=8", "fixtures": ["fixtures/trantype-dynamic/d01-update-then-apply"], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-031", "title": "DYNSQL card reading and comment cards", "rule": "CBTRNDYN reads every 80-byte DYNSQL card to EOF. A card whose columns 1-2 are `--` is skipped; every other card contributes columns 1-72 plus one space to WS-SQL-STMT-ARR (columns 73-80, the sequence-number area, are dropped). All cards form one statement; WS-SQL-STMT-LEN = pointer - 1, i.e. 73 bytes per card including trailing spaces.", "category": "data-mapping", "sources": [{"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 34, "endLine": 40}, {"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 48, "endLine": 51}, {"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 67, "endLine": 83}, {"file": "tools/runjcl/chains.json", "startLine": 96, "endLine": 96}], "fields": ["DYNSQL-REC", "WS-SQL-STMT-LEN", "WS-SQL-STMT-ARR", "WS-SQL-POS"], "given": "DYNSQL `-- ad-hoc fix requested by operations`, `UPDATE TRANSACTION_TYPE`, `   SET TR_DESCRIPTION = 'Payment - SEPA'`, ` WHERE TR_TYPE = '02'`", "when": "CBTRNDYN reads DYNSQL", "then": "the comment is skipped and the three remaining cards are concatenated into one 219-byte statement that updates type 02", "fixtures": ["fixtures/trantype-dynamic/d01-update-then-apply"], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-032", "title": "SQL lines read message", "rule": "After reading DYNSQL the program displays `CBTRNDYN: ` + WS-LINE-COUNT (PIC 9(02), two digits with leading zero) + ` SQL LINES READ`. The count includes every non-comment card, blank cards too.", "category": "sysout", "sources": [{"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 45, "endLine": 45}, {"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 78, "endLine": 78}, {"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 84, "endLine": 84}], "fields": ["WS-LINE-COUNT"], "given": "DYNSQL with one comment card and three statement cards", "when": "CBTRNDYN finishes reading", "then": "SYSOUT `CBTRNDYN: 03 SQL LINES READ`", "fixtures": ["fixtures/trantype-dynamic/d01-update-then-apply", "fixtures/trantype-dynamic/d02-delete-statement"], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-033", "title": "Blank cards and columns 73-80", "rule": "A blank DYNSQL card is not a comment: it adds 73 spaces to the statement and is counted in WS-LINE-COUNT. Text in columns 73-80 never reaches the SQL text. Confirmed by an off-host scratch run of the legacy estate (not a golden case).", "category": "edge-case", "sources": [{"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 73, "endLine": 78}], "fields": ["DYNSQL-REC", "WS-LINE-COUNT"], "given": "DYNSQL `UPDATE TRANSACTION_TYPE` padded to col 72 + `SEQ00010` in cols 73-80, a blank card, `   SET TR_DESCRIPTION = 'Seq' WHERE TR_TYPE = '03'`", "when": "MNTTRDYN runs with an empty INPFILE", "then": "SYSOUT `CBTRNDYN: 03 SQL LINES READ` and `CBTRNDYN: EXECUTE SQLCODE +0000000000`; 03 becomes `Seq`; RC 0", "fixtures": [], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-034", "title": "Only column-1 `--` is a comment; inline `--` swallows the rest", "rule": "Comment detection looks only at columns 1-2. Because all cards are joined into one line with no newline, a `--` that starts later on a card (an inline or indented comment) comments out everything after it, including the following cards.", "category": "edge-case", "sources": [{"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 73, "endLine": 77}], "fields": ["DYNSQL-REC", "WS-SQL-STMT-ARR"], "given": "DYNSQL `DELETE FROM TRANSACTION_TYPE  -- remove fee` then `WHERE TR_TYPE = '06'`", "when": "CBTRNDYN builds and executes the statement", "then": "the statement text becomes `DELETE FROM TRANSACTION_TYPE  -- remove fee ... WHERE TR_TYPE = '06'` all on one line, so the WHERE clause is commented out and the DELETE has no WHERE clause", "fixtures": [], "finding": "Indented or trailing `--` comments silently change the statement (a WHERE clause can be lost). Looks dangerous; must be reproduced (source-only).", "slice": "trantype"}, {"id": "BR-TRT-035", "title": "Statement buffer limit 800 bytes; line count wraps at 100", "rule": "WS-SQL-STMT-ARR is X(800) and each card takes 73 bytes, so only 10 full cards fit; the 11th is cut after 70 bytes and later cards are dropped (STRING ... WITH POINTER with no ON OVERFLOW). WS-SQL-STMT-LEN stops at 800. WS-LINE-COUNT is PIC 9(02) with no ON SIZE ERROR, so a 100th card wraps the count to 00.", "category": "edge-case", "sources": [{"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 45, "endLine": 45}, {"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 48, "endLine": 51}, {"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 74, "endLine": 78}, {"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 83, "endLine": 83}], "fields": ["WS-SQL-STMT-ARR", "WS-SQL-STMT-LEN", "WS-SQL-POS", "WS-LINE-COUNT"], "given": "DYNSQL with 12 non-comment cards", "when": "CBTRNDYN reads them", "then": "WS-SQL-STMT-LEN = 800, text from card 11 column 71 onward is lost without a message, and SYSOUT still says `CBTRNDYN: 12 SQL LINES READ`", "fixtures": [], "finding": "Long statements are silently truncated and the line count is not limited. Must be reproduced (source-only).", "slice": "trantype"}, {"id": "BR-TRT-036", "title": "PREPARE then EXECUTE, PREPARE failure path", "rule": "CBTRNDYN runs PREPARE DYNSTMT FROM :WS-SQL-STMT. If SQLCODE is not 0 it displays `CBTRNDYN: PREPARE FAILED SQLCODE ` + SQLCODE, moves 8 to RETURN-CODE and skips EXECUTE. Otherwise it runs EXECUTE DYNSTMT and always displays `CBTRNDYN: EXECUTE SQLCODE ` + SQLCODE (sign followed by 10 digits under ocesql, e.g. `+0000000000`).", "category": "control-flow", "sources": [{"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 87, "endLine": 98}], "fields": ["WS-SQL-STMT", "SQLCODE", "RETURN-CODE"], "given": "DYNSQL `DELETE FROM TRANSACTION_TYPE WHERE TR_TYPE = '03'`", "when": "MNTTRDYN runs", "then": "SYSOUT `CBTRNDYN: EXECUTE SQLCODE +0000000000`; row 03 is deleted", "fixtures": ["fixtures/trantype-dynamic/d02-delete-statement"], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-037", "title": "Statement errors surface at EXECUTE, not PREPARE, under ocesql", "rule": "Under Open COBOL ESQL the PREPARE returned SQLCODE 0 in every observed case, so the `PREPARE FAILED` branch was never reached: an unknown column surfaces at EXECUTE as -400 (golden d03) and an empty DYNSQL (statement length 0) surfaces at EXECUTE as -212 (scratch run). Db2 would normally reject such statements at PREPARE time with its own SQLCODEs.", "category": "edge-case", "sources": [{"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 88, "endLine": 101}], "fields": ["SQLCODE", "WS-SQL-STMT-LEN"], "given": "DYNSQL `UPDATE TRANSACTION_TYPE SET NO_SUCH_COLUMN = 'x' WHERE TR_TYPE = '01'`", "when": "CBTRNDYN prepares and executes it", "then": "no PREPARE FAILED line; SYSOUT `CBTRNDYN: EXECUTE SQLCODE -0000000400`", "fixtures": ["fixtures/trantype-dynamic/d03-bad-statement"], "finding": "The PREPARE error path was not reached under the harness and the codes differ from Db2 (-400/-212). The recorded ocesql behaviour must be reproduced.", "slice": "trantype"}, {"id": "BR-TRT-038", "title": "EXECUTE SQLCODE < 0 sets RC 8; non-negative does not", "rule": "After EXECUTE only a negative SQLCODE moves 8 to RETURN-CODE. SQLCODE 0, including a dynamic UPDATE/DELETE that matches no row under ocesql, leaves RC unchanged. In every case the program continues to the dynamic CALL. Confirmed by an off-host scratch run of the legacy estate (not a golden case).", "category": "return-code", "sources": [{"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 98, "endLine": 101}], "fields": ["SQLCODE", "RETURN-CODE"], "given": "DYNSQL `UPDATE TRANSACTION_TYPE SET TR_DESCRIPTION = 'x' WHERE TR_TYPE = '99'`", "when": "CBTRNDYN executes it", "then": "SYSOUT `CBTRNDYN: EXECUTE SQLCODE +0000000000`; no RC 8; COBTUPDT is still called", "fixtures": [], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-039", "title": "CBTRNDYN's RC 8 is not the step RC once COBTUPDT runs", "rule": "The step RC is the RETURN-CODE at COBTUPDT's STOP RUN, not the highest code set in the run. The RC 8 set by CBTRNDYN after a failed EXECUTE does not survive the dynamic CALL: with a clean COBTUPDT run the step ends RC 0 (scratch run); in d03 it ends RC 4 because COBTUPDT's own update fails.", "category": "return-code", "sources": [{"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 98, "endLine": 101}, {"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 59, "endLine": 63}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 97, "endLine": 99}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 232, "endLine": 232}], "fields": ["RETURN-CODE"], "given": "DYNSQL with an unknown column and INPFILE `U01Purchase - updated`", "when": "MNTTRDYN runs", "then": "SYSOUT shows `EXECUTE SQLCODE -0000000400` and COBTUPDT's -400 error; rc.json STEP1 = 4 (not 8)", "fixtures": ["fixtures/trantype-dynamic/d03-bad-statement"], "finding": "A failed ad-hoc statement does not show in the step RC (RC 0 if COBTUPDT has nothing to do). Looks wrong; must be reproduced.", "slice": "trantype"}, {"id": "BR-TRT-040", "title": "Dynamic CALL of the program named in PARMS", "rule": "When PARM-LENGTH > 0, CBTRNDYN moves PARM-VALUE(1:PARM-LENGTH) to WS-PGM-NAME (X(8)), displays `CBTRNDYN: CALLING ` + WS-PGM-NAME and runs CALL WS-PGM-NAME with no USING and no ON EXCEPTION. The CALL happens whatever the dynamic SQL outcome. The target is known only from the JCL PARMS, not at compile time.", "category": "control-flow", "sources": [{"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 59, "endLine": 63}, {"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 46, "endLine": 46}, {"file": "app/app-transaction-type-db2/jcl/MNTTRDYN.jcl", "startLine": 33, "endLine": 33}], "fields": ["PARM-LENGTH", "PARM-VALUE", "WS-PGM-NAME"], "given": "PARMS('COBTUPDT') and a failed dynamic statement", "when": "CBTRNDYN reaches the CALL", "then": "SYSOUT `CBTRNDYN: CALLING COBTUPDT` followed by COBTUPDT's `OPEN FILE OK`", "fixtures": ["fixtures/trantype-dynamic/d01-update-then-apply", "fixtures/trantype-dynamic/d03-bad-statement"], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-041", "title": "COBTUPDT's STOP RUN ends the run unit", "rule": "COBTUPDT ends with STOP RUN, not GOBACK, so control never returns to CBTRNDYN: `CBTRNDYN: END` is never displayed and its GOBACK is not reached. The end-of-task exit then commits and prints `DSNRUN: COMMIT AT END OF TASK` as the last line.", "category": "control-flow", "sources": [{"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 97, "endLine": 99}, {"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 64, "endLine": 65}, {"file": "tools/stubs/DSNEXIT.cbl", "startLine": 13, "endLine": 21}], "fields": ["RETURN-CODE"], "given": "the standard MNTTRDYN run", "when": "COBTUPDT finishes its INPFILE", "then": "SYSOUT ends with `RECORD INSERTED SUCCESSFULLY` then `DSNRUN: COMMIT AT END OF TASK`; no `CBTRNDYN: END` line", "fixtures": ["fixtures/trantype-dynamic/d01-update-then-apply"], "finding": "The driver's END message and any code after the CALL are dead in practice. Must be reproduced (no `CBTRNDYN: END` in SYSOUT).", "slice": "trantype"}, {"id": "BR-TRT-042", "title": "No PARMS: no CALL and normal end", "rule": "When PARM-LENGTH is 0 (RUN PROGRAM(CBTRNDYN) without PARMS) the CALL is skipped, `CBTRNDYN: END` is displayed and GOBACK returns to DSNRUN, whose STOP RUN triggers the end-of-task commit. A PARMS value longer than 8 characters is truncated to 8 in WS-PGM-NAME.", "category": "edge-case", "sources": [{"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 59, "endLine": 65}, {"file": "tools/stubs/DSNRUN.cbl", "startLine": 31, "endLine": 35}, {"file": "tools/stubs/DSNRUN.cbl", "startLine": 51, "endLine": 52}], "fields": ["PARM-LENGTH", "WS-PGM-NAME"], "given": "SYSTSIN `RUN PROGRAM(CBTRNDYN) PLAN(CARDDEMO)` and a valid DYNSQL", "when": "the step runs", "then": "SYSOUT `CBTRNDYN: 0n SQL LINES READ`, `CBTRNDYN: EXECUTE SQLCODE ...`, `CBTRNDYN: END`, `DSNRUN: COMMIT AT END OF TASK`; INPFILE is not read", "fixtures": [], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-043", "title": "Dynamic SQL and COBTUPDT share one unit of work", "rule": "The dynamic statement and COBTUPDT's changes are in one unit of work committed at end of task: both persist together on success, and if any statement fails under PostgreSQL both are lost (see BR-TRT-029), including a dynamic statement that reported SQLCODE 0.", "category": "state-change", "sources": [{"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 5, "endLine": 12}, {"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 95, "endLine": 97}, {"file": "tools/stubs/DSNEXIT.cbl", "startLine": 14, "endLine": 14}], "fields": ["TR_TYPE", "TR_DESCRIPTION"], "given": "DYNSQL updating 02 to 'Payment - SEPA' and INPFILE `A04Authorization`", "when": "MNTTRDYN runs", "then": "both changes are committed: 02='Payment - SEPA' and 04='Authorization' padded; RC 0", "fixtures": ["fixtures/trantype-dynamic/d01-update-then-apply"], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-044", "title": "Unqualified names and unpadded literals in dynamic SQL", "rule": "Dynamic statements name TRANSACTION_TYPE without the CARDDEMO qualifier; under PostgreSQL this resolves to the carddemo schema through the default search_path (\"$user\" = carddemo), standing in for the Db2 plan qualifier. Values supplied as SQL literals are stored exactly as written (no 50-byte padding), unlike COBTUPDT's host variables.", "category": "data-mapping", "sources": [{"file": "app/app-transaction-type-db2/cbl/CBTRNDYN.cbl", "startLine": 88, "endLine": 90}, {"file": "db/postgres/01-transaction-type.sql", "startLine": 4, "endLine": 8}], "fields": ["TR_TYPE", "TR_DESCRIPTION"], "given": "DYNSQL `UPDATE TRANSACTION_TYPE SET TR_DESCRIPTION = 'Payment - SEPA' WHERE TR_TYPE = '02'`", "when": "MNTTRDYN runs", "then": "carddemo.transaction_type row 02 holds `Payment - SEPA` with no trailing spaces, while 04 inserted by COBTUPDT is padded to 50", "fixtures": ["fixtures/trantype-dynamic/d01-update-then-apply"], "finding": null, "slice": "trantype"}, {"id": "BR-TRT-045", "title": "ocesql source normalisation (harness)", "rule": "Harness behaviour: tools/esql_prep.py builds scratch copies for Open COBOL ESQL without editing app/: it strips columns 73-80, joins the three-line EXEC SQL INCLUDE SQLCA into one line and removes EXEC SQL DECLARE ... TABLE from DCLGEN members. It does not change program logic, so every rule above is the logic of the unmodified estate source.", "category": "data-mapping", "sources": [{"file": "tools/esql_prep.py", "startLine": 29, "endLine": 55}, {"file": "app/app-transaction-type-db2/dcl/DCLTRTYP.dcl", "startLine": 28, "endLine": 31}, {"file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl", "startLine": 50, "endLine": 52}], "fields": ["DCLTRANSACTION-TYPE", "SQLCA"], "given": "COBTUPDT.cbl with a three-line INCLUDE SQLCA", "when": "make build runs esql_prep", "then": "work/esql/COBTUPDT.cbl has a one-line `EXEC SQL INCLUDE SQLCA END-EXEC.` and the original file is unchanged", "fixtures": [], "finding": null, "slice": "trantype"}, {"id": "BR-ONL-001", "title": "Sign-on first display and screen header", "rule": "When COSGN00C is started with no COMMAREA (EIBCALEN = 0) it clears the output map, puts the cursor on the User ID field and sends the sign-on screen. Every screen send fills the header: titles, transaction CC00, program COSGN00C, date as MM/DD/YY and time as HH:MM:SS from FUNCTION CURRENT-DATE, plus APPLID/SYSID. The task always ends with RETURN TRANSID('CC00') passing CARDDEMO-COMMAREA.", "category": "control-flow", "sources": [{"file": "app/cbl/COSGN00C.cbl", "startLine": 80, "endLine": 83}, {"file": "app/cbl/COSGN00C.cbl", "startLine": 98, "endLine": 102}, {"file": "app/cbl/COSGN00C.cbl", "startLine": 145, "endLine": 157}, {"file": "app/cbl/COSGN00C.cbl", "startLine": 177, "endLine": 204}, {"file": "app/cpy/CSDAT01Y.cpy", "startLine": 31, "endLine": 41}], "fields": ["EIBCALEN", "COSGN0AO", "USERIDL", "CURDATEO", "CURTIMEO", "TRNNAMEO", "PGMNAMEO", "WS-CURDATE-MM-DD-YY", "WS-CURTIME-HH-MM-SS"], "given": "Clock frozen at 2022-07-05 10:00:00 and no COMMAREA (EIBCALEN = 0)", "when": "Transaction CC00 starts", "then": "The sign-on screen is sent with ERRMSG blank, CURDATE '07/05/22', CURTIME '10:00:00', TRNNAME 'CC00', PGMNAME 'COSGN00C', cursor on USERID; the task returns with TRANSID CC00", "fixtures": [], "finding": null, "slice": "online"}, {"id": "BR-ONL-002", "title": "Sign-on PF3 and invalid keys", "rule": "On the sign-on screen PF3 sends the plain text 'Thank you for using CardDemo application...' (CCDA-MSG-THANK-YOU) with ERASE/FREEKB and ends the task without a next TRANSID. ENTER processes the sign-on. Any other AID re-sends the sign-on screen with 'Invalid key pressed. Please see below...' (CCDA-MSG-INVALID-KEY).", "category": "control-flow", "sources": [{"file": "app/cbl/COSGN00C.cbl", "startLine": 85, "endLine": 95}, {"file": "app/cbl/COSGN00C.cbl", "startLine": 162, "endLine": 172}, {"file": "app/cpy/CSMSG01Y.cpy", "startLine": 17, "endLine": 21}], "fields": ["EIBAID", "CCDA-MSG-THANK-YOU", "CCDA-MSG-INVALID-KEY", "WS-MESSAGE"], "given": "The sign-on screen is displayed (EIBCALEN > 0)", "when": "The user presses PF3; in a second case the user presses PF7", "then": "PF3: the screen is erased and shows 'Thank you for using CardDemo application...' and the session ends (plain RETURN). PF7: the sign-on screen is shown again with ERRMSG 'Invalid key pressed. Please see below...'", "fixtures": [], "finding": null, "slice": "online"}, {"id": "BR-ONL-003", "title": "Sign-on blank User ID / Password validation", "rule": "On ENTER the map is received and checked in order: User ID equal to SPACES or LOW-VALUES gives 'Please enter User ID ...' with the cursor on USERID; otherwise a blank Password gives 'Please enter Password ...' with the cursor on PASSWD. Either error sets WS-ERR-FLG = 'Y' and USRSEC is not read. Both input fields are 8 characters (BMS LENGTH=8, password is DRK/non-display).", "category": "validation", "sources": [{"file": "app/cbl/COSGN00C.cbl", "startLine": 108, "endLine": 140}, {"file": "app/bms/COSGN00.bms", "startLine": 156, "endLine": 159}, {"file": "app/bms/COSGN00.bms", "startLine": 175, "endLine": 178}, {"file": "app/cpy-bms/COSGN00.CPY", "startLine": 72, "endLine": 78}], "fields": ["USERIDI", "PASSWDI", "WS-ERR-FLG", "ERRMSGO"], "given": "Sign-on screen with USERID = spaces and PASSWD = 'PASS0001'; second case USERID = 'USER0001' and PASSWD = spaces", "when": "The user presses ENTER", "then": "Case 1: ERRMSG 'Please enter User ID ...', cursor on USERID, no file read. Case 2: ERRMSG 'Please enter Password ...', cursor on PASSWD, no file read", "fixtures": [], "finding": null, "slice": "online"}, {"id": "BR-ONL-004", "title": "Sign-on upper-cases User ID and Password", "rule": "Before the lookup, both the entered User ID and the Password are converted with FUNCTION UPPER-CASE (User ID also into CDEMO-USER-ID). The USRSEC key and the password comparison therefore are case-insensitive for the input.", "category": "data-mapping", "sources": [{"file": "app/cbl/COSGN00C.cbl", "startLine": 132, "endLine": 136}, {"file": "app/cbl/COSGN00C.cbl", "startLine": 223, "endLine": 223}], "fields": ["USERIDI", "PASSWDI", "WS-USER-ID", "WS-USER-PWD", "CDEMO-USER-ID", "SEC-USR-PWD"], "given": "USRSEC holds SEC-USR-ID 'USER0001' with SEC-USR-PWD 'PASSWORD'", "when": "The user signs on with User ID 'user0001' and Password 'password'", "then": "Lookup key is 'USER0001', the compared password is 'PASSWORD', sign-on succeeds", "fixtures": [], "finding": "Passwords are compared after upper-casing the input only: a password stored in lower case in USRSEC can never match, and passwords are effectively case-insensitive. Looks wrong (weak credential check) but must be reproduced.", "slice": "online"}, {"id": "BR-ONL-005", "title": "Sign-on USRSEC lookup return codes", "rule": "USRSEC is read by the 8-byte upper-cased User ID (EXEC CICS READ DATASET('USRSEC') RIDFLD(WS-USER-ID)). RESP 0 proceeds to the password check; RESP 13 (NOTFND) gives 'User not found. Try again ...'; any other RESP gives 'Unable to verify the User ...'. Both errors put the cursor on USERID and re-send the screen.", "category": "return-code", "sources": [{"file": "app/cbl/COSGN00C.cbl", "startLine": 209, "endLine": 221}, {"file": "app/cbl/COSGN00C.cbl", "startLine": 247, "endLine": 257}, {"file": "app/cpy/CSUSR01Y.cpy", "startLine": 17, "endLine": 23}], "fields": ["WS-USRSEC-FILE", "WS-USER-ID", "WS-RESP-CD", "SEC-USER-DATA"], "given": "USRSEC does not contain 'NOUSER01'", "when": "The user signs on with User ID 'NOUSER01' and any password", "then": "READ returns RESP 13 and the screen shows 'User not found. Try again ...' with cursor on USERID; an I/O error (e.g. RESP 12 file not open) shows 'Unable to verify the User ...'", "fixtures": [], "finding": null, "slice": "online"}, {"id": "BR-ONL-006", "title": "Sign-on wrong password", "rule": "When the USRSEC record exists but SEC-USR-PWD differs from the upper-cased input password, the screen is re-sent with 'Wrong Password. Try again ...' and the cursor on PASSWD. No COMMAREA routing fields are set.", "category": "validation", "sources": [{"file": "app/cbl/COSGN00C.cbl", "startLine": 223, "endLine": 223}, {"file": "app/cbl/COSGN00C.cbl", "startLine": 241, "endLine": 246}], "fields": ["SEC-USR-PWD", "WS-USER-PWD", "PASSWDL", "WS-MESSAGE"], "given": "USRSEC record 'USER0001' with password 'PASSWORD'", "when": "The user signs on with 'USER0001' / 'WRONGPW1'", "then": "ERRMSG 'Wrong Password. Try again ...', cursor on PASSWD, no XCTL", "fixtures": [], "finding": "This branch does not set WS-ERR-FLG (the blank-field and not-found branches do). It has no visible effect because nothing runs after it, but a port that relies on the flag must keep the same outcome.", "slice": "online"}, {"id": "BR-ONL-007", "title": "Sign-on success: COMMAREA and admin vs regular routing", "rule": "On a password match COSGN00C fills CARDDEMO-COMMAREA: CDEMO-FROM-TRANID = 'CC00', CDEMO-FROM-PROGRAM = 'COSGN00C', CDEMO-USER-ID = upper-cased id, CDEMO-USER-TYPE = SEC-USR-TYPE, CDEMO-PGM-CONTEXT = 0 (enter). If the user type is 'A' (CDEMO-USRTYP-ADMIN) it XCTLs to COADM01C, otherwise (any other value, including 'U' or blank) to COMEN01C, passing the COMMAREA.", "category": "state-change", "sources": [{"file": "app/cbl/COSGN00C.cbl", "startLine": 222, "endLine": 240}, {"file": "app/cpy/COCOM01Y.cpy", "startLine": 19, "endLine": 44}], "fields": ["CDEMO-FROM-TRANID", "CDEMO-FROM-PROGRAM", "CDEMO-USER-ID", "CDEMO-USER-TYPE", "CDEMO-PGM-CONTEXT", "SEC-USR-TYPE"], "given": "USRSEC records ADMIN001/PASSWORD type 'A' and USER0001/PASSWORD type 'U'", "when": "Each user signs on with the correct password", "then": "ADMIN001: XCTL COADM01C with CDEMO-USER-TYPE 'A', CDEMO-PGM-CONTEXT 0. USER0001: XCTL COMEN01C with CDEMO-USER-TYPE 'U', CDEMO-FROM-PROGRAM 'COSGN00C', CDEMO-FROM-TRANID 'CC00'", "fixtures": [], "finding": "Any SEC-USR-TYPE other than 'A' (including blank or an unexpected code) is routed to the regular-user menu instead of being rejected. Must be reproduced.", "slice": "online"}, {"id": "BR-ONL-008", "title": "Menu entry, PF3 and invalid keys", "rule": "COMEN01C with no COMMAREA XCTLs to the sign-on program (CDEMO-TO-PROGRAM defaults to 'COSGN00C' when LOW-VALUES/SPACES). With a COMMAREA it is copied into CARDDEMO-COMMAREA; on first entry (CDEMO-PGM-CONTEXT 0) the context is set to 1 (re-enter) and the menu is sent. On re-entry ENTER processes the option, PF3 XCTLs to COSGN00C, any other key re-sends the menu with 'Invalid key pressed. Please see below...'. The task ends with RETURN TRANSID('CM00') COMMAREA(CARDDEMO-COMMAREA).", "category": "control-flow", "sources": [{"file": "app/cbl/COMEN01C.cbl", "startLine": 82, "endLine": 110}, {"file": "app/cbl/COMEN01C.cbl", "startLine": 196, "endLine": 203}], "fields": ["EIBCALEN", "EIBAID", "CDEMO-PGM-CONTEXT", "CDEMO-TO-PROGRAM", "CDEMO-FROM-PROGRAM"], "given": "A regular user arrives from COSGN00C with CDEMO-PGM-CONTEXT 0", "when": "The menu is shown, then the user presses PF3", "then": "First pass: menu sent and context becomes 1 (CDEMO-PGM-REENTER). PF3: XCTL to COSGN00C. With EIBCALEN = 0 the program XCTLs straight to COSGN00C", "fixtures": [], "finding": null, "slice": "online"}, {"id": "BR-ONL-009", "title": "Menu options table and display", "rule": "The regular-user menu is driven by CARDDEMO-MAIN-MENU-OPTIONS: CDEMO-MENU-OPT-COUNT = 11 and entries (number, 35-char name, program, user type): 1 Account View COACTVWC, 2 Account Update COACTUPC, 3 Credit Card List COCRDLIC, 4 Credit Card View COCRDSLC, 5 Credit Card Update COCRDUPC, 6 Transaction List COTRN00C, 7 Transaction View COTRN01C, 8 Transaction Add COTRN02C, 9 Transaction Reports CORPT00C, 10 Bill Payment COBIL00C, 11 Pending Authorization View COPAUS0C; all with user type 'U'. Each screen line is STRING number '. ' name into a 40-char field, OPTN001..OPTN012.", "category": "data-mapping", "sources": [{"file": "app/cpy/COMEN02Y.cpy", "startLine": 19, "endLine": 98}, {"file": "app/cbl/COMEN01C.cbl", "startLine": 208, "endLine": 220}, {"file": "app/cbl/COMEN01C.cbl", "startLine": 262, "endLine": 303}], "fields": ["CDEMO-MENU-OPT-COUNT", "CDEMO-MENU-OPT-NUM", "CDEMO-MENU-OPT-NAME", "CDEMO-MENU-OPT-PGMNAME", "CDEMO-MENU-OPT-USRTYPE", "OPTN001O"], "given": "The menu is sent", "when": "BUILD-MENU-OPTIONS runs", "then": "OPTN001O = '01. Account View' (padded to 40), OPTN011O = '11. Pending Authorization View', OPTN012O stays LOW-VALUES", "fixtures": [], "finding": "Item 8 is labelled 'Transaction Add' with user type 'U'; the original '(Admin Only)' label is commented out, so regular users can reach COTRN02C. Must be reproduced.", "slice": "online"}, {"id": "BR-ONL-010", "title": "Menu option parsing", "rule": "The 2-character OPTION input is scanned right-to-left for the last non-space character, that prefix is moved into a right-justified PIC X(2) (WS-OPTION-X JUST RIGHT), spaces are replaced by '0', and the result moved to PIC 9(2) WS-OPTION, which is echoed back to the OPTION field.", "category": "data-mapping", "sources": [{"file": "app/cbl/COMEN01C.cbl", "startLine": 45, "endLine": 46}, {"file": "app/cbl/COMEN01C.cbl", "startLine": 117, "endLine": 125}, {"file": "app/bms/COMEN01.bms", "startLine": 145, "endLine": 148}, {"file": "app/cpy-bms/COMEN01.CPY", "startLine": 132, "endLine": 132}], "fields": ["OPTIONI", "WS-OPTION-X", "WS-OPTION", "OPTIONO"], "given": "Menu displayed", "when": "The user types '1 ' (1 then space), ' 1', or '10' and presses ENTER", "then": "'1 ' and ' 1' both become WS-OPTION 01; '10' stays 10", "fixtures": [], "finding": null, "slice": "online"}, {"id": "BR-ONL-011", "title": "Menu invalid option number", "rule": "If WS-OPTION is not numeric, is zero, or is greater than CDEMO-MENU-OPT-COUNT (11), the menu is re-sent with 'Please enter a valid option number...' and no XCTL happens.", "category": "validation", "sources": [{"file": "app/cbl/COMEN01C.cbl", "startLine": 127, "endLine": 134}, {"file": "app/cpy/COMEN02Y.cpy", "startLine": 21, "endLine": 21}], "fields": ["WS-OPTION", "CDEMO-MENU-OPT-COUNT", "WS-ERR-FLG"], "given": "Menu displayed for a regular user", "when": "The user enters '00', '12' or blank and presses ENTER", "then": "ERRMSG 'Please enter a valid option number...', no program transfer", "fixtures": [], "finding": "After this error the code does not stop: it goes on to the admin check, which reads CDEMO-MENU-OPT-USRTYPE(WS-OPTION) with an out-of-range subscript (0 or 12-99), outside the 11 loaded entries. No transfer happens because the error flag is set, but a port must not raise an index error and must still show only this message. Looks wrong; reproduce the visible outcome.", "slice": "online"}, {"id": "BR-ONL-012", "title": "Menu admin-only option authorization", "rule": "If the signed-on user is a regular user (CDEMO-USRTYP-USER, 'U') and the selected entry has CDEMO-MENU-OPT-USRTYPE = 'A', the menu is re-sent with 'No access - Admin Only option... ' and no XCTL. In the shipped table every entry is 'U', so this check never fires today.", "category": "validation", "sources": [{"file": "app/cbl/COMEN01C.cbl", "startLine": 136, "endLine": 143}, {"file": "app/cpy/COMEN02Y.cpy", "startLine": 25, "endLine": 90}], "fields": ["CDEMO-USER-TYPE", "CDEMO-MENU-OPT-USRTYPE", "WS-MESSAGE"], "given": "A table entry 3 with user type 'A' (configuration variant) and a regular user 'U'", "when": "The user selects option 3", "then": "ERRMSG 'No access - Admin Only option... ', no XCTL; with the shipped table (all 'U') the same selection XCTLs to COCRDLIC", "fixtures": [], "finding": null, "slice": "online"}, {"id": "BR-ONL-013", "title": "Menu not-installed and coming-soon options", "rule": "For program COPAUS0C the menu first issues EXEC CICS INQUIRE PROGRAM NOHANDLE; if EIBRESP is not NORMAL it shows in red 'This option ' + the option name up to the first double space + ' is not installed...'. For any program whose name starts with 'DUMMY' it shows in green 'This option ' + the name up to the first single space + 'is coming soon ...'. In both cases the menu is re-sent and no XCTL occurs.", "category": "control-flow", "sources": [{"file": "app/cbl/COMEN01C.cbl", "startLine": 145, "endLine": 176}, {"file": "app/cbl/COMEN01C.cbl", "startLine": 190, "endLine": 191}], "fields": ["CDEMO-MENU-OPT-PGMNAME", "CDEMO-MENU-OPT-NAME", "EIBRESP", "ERRMSGC", "WS-MESSAGE"], "given": "COPAUS0C is not defined in the CICS region; a hypothetical entry 'Card Rewards' points to 'DUMMY001'", "when": "The user selects option 11, then the DUMMY option", "then": "Option 11: red ERRMSG 'This option Pending Authorization View is not installed...'. DUMMY: green ERRMSG 'This option Cardis coming soon ...'", "fixtures": [], "finding": "The coming-soon text uses DELIMITED BY SPACE, so only the first word of the option name is kept and there is no space before 'is'. Looks wrong but must be reproduced.", "slice": "online"}, {"id": "BR-ONL-014", "title": "Menu transfer to the selected program", "rule": "For any other valid option the menu sets CDEMO-FROM-TRANID = 'CM00', CDEMO-FROM-PROGRAM = 'COMEN01C', CDEMO-PGM-CONTEXT = 0 and XCTLs to CDEMO-MENU-OPT-PGMNAME(option) passing CARDDEMO-COMMAREA. User id and user type are passed through unchanged.", "category": "state-change", "sources": [{"file": "app/cbl/COMEN01C.cbl", "startLine": 145, "endLine": 146}, {"file": "app/cbl/COMEN01C.cbl", "startLine": 177, "endLine": 191}], "fields": ["CDEMO-FROM-TRANID", "CDEMO-FROM-PROGRAM", "CDEMO-PGM-CONTEXT", "CDEMO-MENU-OPT-PGMNAME"], "given": "Regular user USER0001 on the menu", "when": "The user enters option 1 and presses ENTER", "then": "XCTL PROGRAM('COACTVWC') with CDEMO-FROM-PROGRAM 'COMEN01C', CDEMO-FROM-TRANID 'CM00', CDEMO-PGM-CONTEXT 0, CDEMO-USER-ID 'USER0001'", "fixtures": [], "finding": null, "slice": "online"}, {"id": "BR-ONL-015", "title": "PF-key normalisation and valid keys on Account View", "rule": "YYYY-STORE-PFKEY maps EIBAID to CCARD-AID-*: ENTER, CLEAR, PA1, PA2, PF1-PF12, and PF13-PF24 fold onto PF1-PF12. In COACTVWC only ENTER and PF3 are valid; any other key is silently treated as ENTER.", "category": "control-flow", "sources": [{"file": "app/cpy/CSSTRPFY.cpy", "startLine": 17, "endLine": 80}, {"file": "app/cbl/COACTVWC.cbl", "startLine": 299, "endLine": 314}], "fields": ["EIBAID", "CCARD-AID", "PFK-VALID", "PFK-INVALID"], "given": "Account View screen displayed with account 00000000001 entered", "when": "The user presses PF15; in another case PF8", "then": "PF15 acts as PF3 (exit). PF8
