spring.datasource.url=${CARDEMO_DB_URL:jdbc:postgresql://localhost:5432/carddemo_java?currentSchema=carddemo,public}
spring.datasource.username=${CARDEMO_DB_USER:carddemo}
spring.datasource.password=${CARDEMO_DB_PASSWORD:carddemo}
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.batch.jdbc.initialize-schema=never
spring.batch.job.enabled=false
spring.main.banner-mode=off
server.port=${PORT:8080}
